[workspace]
members = [
  "crates/lila-front",
  "crates/lila-ir",
  "crates/lila-intl",
  "crates/lila-runtime",
  "crates/lila-spec-exec",
  "crates/lila-aot-wasm",
  "crates/lila-backend-c",
  "crates/lila-backend-native",
  "crates/lila-engine",
  "crates/lila-cli",
  "crates/lila-test262",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Lila contributors"]
repository = "https://github.com/mewhhaha/porffor"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
boa_ast = { path = "vendor/boa_ast-0.21.1" }
boa_engine = { path = "vendor/boa_engine-0.21.1" }
boa_parser = { path = "vendor/boa_parser-0.21.1" }
icu_calendar = { path = "vendor/icu_calendar-2.0.6" }
regress = { path = "vendor/regress-0.10.5" }
temporal_rs = { path = "vendor/temporal_rs-0.1.0" }

# Developer builds keep Lila's large IR/backend crates cheap to rebuild,
# while compiling third-party code (notably Wasmtime/Cranelift) once at a
# useful optimization level. `line-tables-only` preserves source locations
# without the much larger full debuginfo footprint.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Release is what drives multi-hour Test262 sweeps. Line tables cost binary size
# only and make a panic in hour six diagnosable.
#
# Deliberately no `lto` and no `codegen-units = 1`. Workspace code is roughly 7%
# of a cold compile (measured: 0.84 s lowering against 11.73 s native Cranelift
# compilation), so both settings optimize the small end while taxing every
# rebuild-after-compiler-edit — which is the loop this project actually runs.
[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
opt-level = 2

# Package overrides win over the wildcard dependency setting above. Keep all
# workspace crates at opt-level 0 so an IR/backend edit does not trigger a slow
# optimized rebuild of Lila itself.
[profile.dev.package.lila-front]
opt-level = 0
[profile.dev.package.lila-ir]
opt-level = 0
[profile.dev.package.lila-intl]
opt-level = 0
[profile.dev.package.lila-runtime]
opt-level = 0
[profile.dev.package.lila-spec-exec]
opt-level = 0
[profile.dev.package.lila-aot-wasm]
opt-level = 0
[profile.dev.package.lila-backend-c]
opt-level = 0
[profile.dev.package.lila-backend-native]
opt-level = 0
[profile.dev.package.lila-engine]
opt-level = 0
[profile.dev.package.lila-cli]
opt-level = 0
[profile.dev.package.lila-test262]
opt-level = 0

[profile.test.package.lila-front]
opt-level = 0
[profile.test.package.lila-ir]
opt-level = 0
[profile.test.package.lila-intl]
opt-level = 0
[profile.test.package.lila-runtime]
opt-level = 0
[profile.test.package.lila-spec-exec]
opt-level = 0
[profile.test.package.lila-aot-wasm]
opt-level = 0
[profile.test.package.lila-backend-c]
opt-level = 0
[profile.test.package.lila-backend-native]
opt-level = 0
[profile.test.package.lila-engine]
opt-level = 0
[profile.test.package.lila-cli]
opt-level = 0
[profile.test.package.lila-test262]
opt-level = 0
