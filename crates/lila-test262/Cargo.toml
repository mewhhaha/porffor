[package]
name = "lila-test262"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lila-engine = { path = "../lila-engine" }
lila-front = { path = "../lila-front" }
lila-ir = { path = "../lila-ir" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Off-by-default developer/differential-oracle toggle. Forwards to
# lila-engine's quarantined Boa oracle (T27). Product builds and the default
# `cargo test`/`cargo tree` graph for lila-cli must stay interpreter-free, so
# this feature must never be enabled by a non-dev dependency. Harness-mechanics
# unit tests that exercise the spec-exec fake-suite oracle are gated on it and
# require `cargo test -p lila-test262 --features spec-exec-oracle`.
spec-exec-oracle = ["lila-engine/spec-exec-oracle"]

[lib]
path = "src/lib.rs"
