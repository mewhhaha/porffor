[package]
name = "porffor-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
porffor-aot-wasm = { path = "../porffor-aot-wasm" }
porffor-backend-c = { path = "../porffor-backend-c" }
porffor-backend-native = { path = "../porffor-backend-native" }
porffor-front = { path = "../porffor-front" }
porffor-ir = { path = "../porffor-ir" }
porffor-runtime = { path = "../porffor-runtime" }
porffor-spec-exec = { path = "../porffor-spec-exec", optional = true }
wasmi = "0.31.2"
wasmtime = { version = "38.0.4", default-features = false, features = ["cache", "cranelift", "gc", "gc-drc", "gc-null", "runtime", "std", "threads"] }

[dev-dependencies]
wasmparser = "0.245.1"

[features]
# Off by default: keeps the Boa interpreter (porffor-spec-exec / boa_engine)
# out of product and release builds. Only enable for developer-only
# differential-oracle testing (see AGENTS.md and tasks/25). Never enable this
# feature for a shipped/product build.
spec-exec-oracle = ["dep:porffor-spec-exec"]

[lib]
path = "src/lib.rs"
