[package]
name = "porffor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
porffor-engine = { path = "../porffor-engine" }
porffor-test262 = { path = "../porffor-test262" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Off by default: product/release builds of `porf` must link no JavaScript
# interpreter/VM engine (AGENTS.md). Enable only for developer-only
# differential-oracle testing (`--execution-backend spec-exec`); see tasks/25
# and tasks/27. `cargo build -p porffor-cli` (no flags) must never pull in
# boa_engine.
spec-exec-oracle = ["porffor-engine/spec-exec-oracle"]

[[bin]]
name = "porf"
path = "src/main.rs"
