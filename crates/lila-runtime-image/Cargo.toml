[package]
name = "lila-runtime-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[build-dependencies]
cc = "1.2.59"
sha2 = "0.10.9"
lila-aot-wasm = { path = "../lila-aot-wasm" }
lila-intl = { path = "../lila-intl" }
lila-ir = { path = "../lila-ir" }
wasmtime = { version = "=47.0.0", default-features = false, features = ["all-arch", "cache", "cranelift", "gc", "gc-copying", "incremental-cache", "parallel-compilation", "runtime", "std", "threads"] }
