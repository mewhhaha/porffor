[package]
name = "lila-intl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
icu_locale = { version = "=2.0.0", default-features = false, features = ["compiled_data"] }
icu_locale_data = { version = "=2.0.0", default-features = false }
icu_provider = { version = "=2.0.0", default-features = false, features = ["sync"] }

# Exact, locked data/selector inputs; no OS zone database is consulted.
jiff-tzdb = "=0.1.6"
timezone_provider = { version = "=0.1.2", default-features = false, features = ["tzif"] }
tzif = "=0.4.1"
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
