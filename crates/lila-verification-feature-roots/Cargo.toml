[package]
name = "lila-verification-feature-roots"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = []
feature-roots = []

[dependencies]
lila-front = { path = "../lila-front" }
lila-ir = { path = "../lila-ir" }
lila-intl-collator-data = { path = "../lila-intl-collator-data" }
lila-runtime = { path = "../lila-runtime" }
lila-runtime-image = { path = "../lila-runtime-image" }
lila-spec-exec = { path = "../lila-spec-exec" }
lila-aot-wasm = { path = "../lila-aot-wasm" }
lila-backend-c = { path = "../lila-backend-c" }
lila-backend-native = { path = "../lila-backend-native" }
lila-engine = { path = "../lila-engine" }
lila-cli = { path = "../lila-cli" }
lila-test262 = { path = "../lila-test262" }

[dev-dependencies]
boa_parser = { version = "0.21.1", features = ["annex-b"] }
serde_json = "1.0"

[[test]]
name = "feature_roots"
path = "tests/feature_roots.rs"
required-features = ["feature-roots"]
