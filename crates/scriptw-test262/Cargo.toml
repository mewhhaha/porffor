[package]
name = "scriptw-test262"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scriptw-engine = { path = "../scriptw-engine" }
scriptw-front = { path = "../scriptw-front" }
scriptw-ir = { path = "../scriptw-ir" }
scriptw-runtime = { path = "../scriptw-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[features]
# Off-by-default developer/differential-oracle toggle. Forwards to
# scriptw-engine's quarantined Boa oracle (T27). Product builds and the default
# `cargo test`/`cargo tree` graph for scriptw-cli must stay interpreter-free, so
# this feature must never be enabled by a non-dev dependency. Harness-mechanics
# unit tests that exercise the spec-exec fake-suite oracle are gated on it and
# require `cargo test -p scriptw-test262 --features spec-exec-oracle`.
spec-exec-oracle = ["scriptw-engine/spec-exec-oracle"]

[lib]
path = "src/lib.rs"

# A real selected executable for developer tests and library embedders.
[[bin]]
name = "scriptw-differential-worker"
path = "src/bin/scriptw-differential-worker.rs"
required-features = ["spec-exec-oracle"]
