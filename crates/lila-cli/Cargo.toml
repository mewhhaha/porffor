[package]
name = "lila-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
lila-engine = { path = "../lila-engine" }
lila-test262 = { path = "../lila-test262" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Off by default: product/release builds of `lila` must link no JavaScript
# interpreter/VM engine (AGENTS.md). Enable only for developer-only
# differential-oracle testing (`differential replay --oracle spec-exec` or an
# explicit `--execution-backend spec-exec`); see tasks/25 and tasks/27. A plain
# `cargo build -p lila-cli` must never pull in boa_engine.
spec-exec-oracle = [
  "lila-engine/spec-exec-oracle",
  "lila-test262/spec-exec-oracle",
]

[[bin]]
name = "lila"
path = "src/bin/lila.rs"

[lib]
path = "src/lib.rs"
