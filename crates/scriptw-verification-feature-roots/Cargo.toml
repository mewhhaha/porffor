[package]
name = "scriptw-verification-feature-roots"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = []
feature-roots = []

[dependencies]
scriptw-front = { path = "../scriptw-front" }
scriptw-ir = { path = "../scriptw-ir" }
scriptw-intl-collator-data = { path = "../scriptw-intl-collator-data" }
scriptw-runtime = { path = "../scriptw-runtime" }
scriptw-runtime-image = { path = "../scriptw-runtime-image" }
scriptw-spec-exec = { path = "../scriptw-spec-exec" }
scriptw-aot-wasm = { path = "../scriptw-aot-wasm" }
scriptw-backend-c = { path = "../scriptw-backend-c" }
scriptw-backend-native = { path = "../scriptw-backend-native" }
scriptw-engine = { path = "../scriptw-engine" }
scriptw-cli = { path = "../scriptw-cli" }
scriptw-test262 = { path = "../scriptw-test262" }

[dev-dependencies]
boa_parser = { version = "0.21.1", features = ["annex-b"] }
serde_json = "1.0"

[[test]]
name = "feature_roots"
path = "tests/feature_roots.rs"
required-features = ["feature-roots"]
