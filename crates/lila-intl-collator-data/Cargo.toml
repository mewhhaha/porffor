[package]
name = "lila-intl-collator-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
icu_collator = { version = "=2.0.0", default-features = false }
icu_collections = { version = "=2.0.0", default-features = false }
icu_locale = { version = "=2.0.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "=2.0.1", default-features = false }
icu_provider = { version = "=2.0.0", default-features = false, features = ["sync", "baked"] }
zerovec = { version = "=0.11.6", default-features = false, features = ["alloc"] }

# Baked ICU exporter macros construct validated static data with generated unsafe.
# Handwritten code stays under deny; only the private generated expansion module
# has a scoped allowance. Other product crates inherit workspace forbid.
[lints.rust]
unsafe_code = "deny"

[lib]
path = "src/lib.rs"
