<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 757" role="img" aria-labelledby="title description">
<title id="title">Scriptw versus V8 elapsed time and peak process memory</title>
<desc id="description">Elapsed time and peak process memory; lower is better. Each section uses a shared zero-based linear scale: milliseconds for median elapsed times, MiB for peak process RSS. Startup RSS values are medians; retained-object RSS covers the whole child process, including compilation and warmups. RSS includes host/runtime overhead and is not JavaScript heap usage. Cold start: V8 17.521 ms, Scriptw 698.4 ms; Cached start: V8 17.595 ms, Scriptw 517.923 ms; 10,000 integer steps: V8 2.025 ms, Scriptw 4.799 ms; 500 objects: V8 0.052 ms, Scriptw 5.515 ms; 8,192 retained objects: V8 2.614 ms, Scriptw 422.117 ms. Cold start: V8 49.79 MiB, Scriptw 388.71 MiB; Cached start: V8 49.82 MiB, Scriptw 358.03 MiB; 8,192 retained objects: V8 76.68 MiB, Scriptw 405.25 MiB. </desc>
