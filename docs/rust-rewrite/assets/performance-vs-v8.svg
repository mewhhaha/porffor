<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 423" role="img" aria-labelledby="title description">
<title id="title">Scriptw performance versus V8</title>
<desc id="description">Scriptw elapsed time divided by V8 elapsed time. V8 equals one; lower is better. Logarithmic horizontal scale. Cold start: Scriptw 698.4 ms, V8 17.5208 ms, 39.86×; Cached start: Scriptw 517.923 ms, V8 17.5955 ms, 29.44×; 10,000 integer steps: Scriptw 4.79895 ms, V8 2.02482 ms, 2.37×; 500 objects: Scriptw 5.51529 ms, V8 0.05188 ms, 106.31×; 8,192 retained objects: Scriptw 422.117 ms, V8 2.61395 ms, 161.49×</desc>
