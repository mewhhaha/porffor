name: Prepare publication driver change

on:
  push:
    branches:
      - codex/prepare-publication-driver-20260906

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble checksum-verified changes and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/publication-preparation
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'README.md': '5e5408b0579f2b97f4b9df72b1d7d6a8e50be78f',
              'tasks/01-baseline-and-generated-backlog.md': '20a5f5fb389d9fd801b2df5e6816b1f402345759',
              'scripts/publish-real-status-low-ram.sh': '91600ce41b9779b4aa3dcc4589fa0291159302a3',
              'scripts/test_publish_real_status_low_ram.py': '70a17bbe8031316f78e5ff86e14a8e2df05a160e',
              'docs/rust-rewrite/reproducible-publication-driver.md': 'b1a9c0e0e54cd072eba9d66f50800c89b06908e0',
              '.github/workflows/publication-driver.yaml': 'cd82992fdbbd02d158d8e7312ae234001f44ef84',
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          path = Path('scripts/test_publish_real_status_low_ram.py')
          text = path.read_text()
          old = 'self.assertEqual(self.calls("publish-status")), [])'
          assert text.count(old) == 1
          text = text.replace(old, 'self.assertEqual(self.calls("publish-status"), [])')
          old = 'text=True, capture_output=True, timeout=10,'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'text=True, capture_output=True, timeout=30,'))
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == '7b03cc34985e36a2db10397b214fd70c72624e4c'
          path = Path('README.md')
          text = path.read_text()
          anchor = 'The generated\nfull-suite status below is unchanged.\n'
          assert text.count(anchor) == 1
          addition = ('\nThe low-RAM real-suite publication driver now records the checkout commit and\n'
                      'compiler SHA-256, checks them between CLI invocations, and rejects stalled or\n'
                      'inconsistent matrix progress before calling the Rust publisher. See\n'
                      '[the publication-driver contract](docs/rust-rewrite/reproducible-publication-driver.md)\n'
                      'for resume safeguards and provenance limits. This does not establish a new\n'
                      'current-pin baseline or change the generated status block.\n')
          path.write_text(text.replace(anchor, anchor + addition))
          path = Path('tasks/01-baseline-and-generated-backlog.md')
          text = path.read_text()
          anchor = '## Objective\n'
          assert text.count(anchor) == 1
          addition = ('The low-RAM publication wrapper now prints the checkout commit and executable\n'
                      'SHA-256 into the publication transcript and checks both between CLI invocations.\n'
                      'It permits one initial checkpoint attempt, then rejects unreadable, stalled,\n'
                      'regressing or inconsistent progress instead of retrying indefinitely. Exact\n'
                      'positive completion is required before delegating to the existing Rust publisher.\n'
                      'The nonempty driver contract inventory runs in read-only CI; these fake-CLI\n'
                      'orchestration tests are not compiler or Test262 conformance evidence. See\n'
                      '[the driver contract](../docs/rust-rewrite/reproducible-publication-driver.md).\n'
                      'This does not bind older checkpoints to a compiler or introduce optional\n'
                      'snapshot provenance metadata. Current-pin publication and the separately\n'
                      'designed mandatory provenance schema remain open.\n\n')
          path.write_text(text.replace(anchor, addition + anchor))
          PY
          git rm -- .github/workflows/prepare-publication-driver.yaml
          git add README.md tasks/01-baseline-and-generated-backlog.md scripts/publish-real-status-low-ram.sh scripts/test_publish_real_status_low_ram.py docs/rust-rewrite/reproducible-publication-driver.md .github/workflows/publication-driver.yaml
          git diff --check 8bc0a567835deb3b7fe2c5ada09f98adf373c0a4
          bash -n scripts/publish-real-status-low-ram.sh
          python3 -m py_compile scripts/test_publish_real_status_low_ram.py
      - name: Validate repository boundaries
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-readme-status-artifacts.sh 8bc0a567835deb3b7fe2c5ada09f98adf373c0a4
          ./scripts/check-task-plan.sh
          ./scripts/check-no-legacy-js.sh
          ./scripts/check-lila-identity.sh
          ./scripts/check-module-boundaries.sh
      - name: Reproduce four original driver defects without product execution
        shell: bash
        run: |
          set -euo pipefail
          git show 8bc0a567835deb3b7fe2c5ada09f98adf373c0a4:scripts/publish-real-status-low-ram.sh > /tmp/baseline-publication.sh
          test "$(git hash-object /tmp/baseline-publication.sh)" = a18d70a3d4e6347da3c6d574c9c28430f9162590
          PUBLISH_WRAPPER=/tmp/baseline-publication.sh python3 - <<'PY' 2>&1 | tee /tmp/publication-preparation/baseline.log
          import importlib.util
          import unittest
          spec = importlib.util.spec_from_file_location('driver_tests', 'scripts/test_publish_real_status_low_ram.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          names = ['test_stalled_progress_stops_after_one_report', 'test_completed_exceeding_total_never_publishes', 'test_binary_change_after_report_prevents_further_cli_calls', 'test_progress_failure_after_bootstrap_is_not_retried']
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(module.PublicationDriverTests(name) for name in names))
          assert result.testsRun == 4 and len(result.failures) == 4 and not result.errors and not result.skipped
          print('BASELINE ONLY: all four desired-behavior assertions fail on the unchanged original wrapper; no errors or skips.')
          PY
      - name: Run the complete corrected contract inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_publish_real_status_low_ram.py 2>&1 | tee /tmp/publication-preparation/contracts.log
      - name: Store verified feature commit without updating any branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          base = '8bc0a567835deb3b7fe2c5ada09f98adf373c0a4'
          paths = {'README.md': '100644', 'tasks/01-baseline-and-generated-backlog.md': '100644', 'scripts/publish-real-status-low-ram.sh': '100755', 'scripts/test_publish_real_status_low_ram.py': '100644', 'docs/rust-rewrite/reproducible-publication-driver.md': '100644', '.github/workflows/publication-driver.yaml': '100644'}
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', base], text=True).splitlines())
          assert actual == set(paths), actual
          def post(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/mewhhaha/porffor/' + endpoint, data=json.dumps(data).encode(), headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = [{'path': path, 'mode': mode, 'type': 'blob', 'content': Path(path).read_text()} for path, mode in paths.items()]
          tree = post('git/trees', {'base_tree': '6101bbe2bf9fa551b2015265e50b09aa67b961f1', 'tree': entries})
          assert tree['sha'] == subprocess.check_output(['git', 'write-tree'], text=True).strip()
          commit = post('git/commits', {'message': 'fix(test262): guard low-RAM publication progress and compiler identity', 'tree': tree['sha'], 'parents': [base]})
          result = {'base': base, 'commit': commit['sha'], 'tree': tree['sha'], 'blobs': {path: subprocess.check_output(['git', 'hash-object', path], text=True).strip() for path in paths}}
          Path('/tmp/publication-preparation/prepared.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-driver-preparation
          path: /tmp/publication-preparation
          if-no-files-found: error
