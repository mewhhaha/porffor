name: AOT source snapshot

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/aot-source-snapshot.yaml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/aot-suspended-references'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Snapshot tracked compiler and tests
        run: git archive --format=tar.gz HEAD > /tmp/aot-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: aot-source
          path: /tmp/aot-source.tar.gz
          retention-days: 1
          compression-level: 0
