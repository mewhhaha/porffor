name: AOT cache publication

on:
  pull_request:
    paths:
      - '.github/actions/rust-verification/**'
      - 'crates/scriptw-engine/**'
      - 'Cargo.lock'
      - '.github/workflows/aot-cache-publication.yaml'
  push:
    branches: [main]
    paths:
      - '.github/actions/rust-verification/**'
      - 'crates/scriptw-engine/**'
      - 'Cargo.lock'
      - '.github/workflows/aot-cache-publication.yaml'

permissions:
  contents: read

concurrency:
  group: aot-cache-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-verification
        with:
          shared-key: aot-correctness
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify cache regression inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p scriptw-engine --lib cache::atomic_tests:: -- --list | tee /tmp/cache-tests.txt
          grep -Fq 'cache::atomic_tests::distinct_cache_instances_publish_complete_entries: test' /tmp/cache-tests.txt
      - name: Run all cache regressions
        run: >-
          cargo test --locked -p scriptw-engine --lib cache::
