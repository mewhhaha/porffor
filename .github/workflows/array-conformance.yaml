name: Array conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: array-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flat-map:
    name: flatMap Wasm-AOT conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check formatting and semantic ownership guards
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p lila-aot-wasm --test array_flat_map_algorithm_owner_structure --test array_flat_map_typed_array_witness_structure --test array_species_create_operation_evidence_structure --test array_concat_algorithm_owner_structure --test concat_typed_array_witness_structure

      - name: Execute the complete nonempty engine regression inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-engine --test aot_flat_map -- --list | tee /tmp/flatmap-inventory.txt
          cargo test --locked -p lila-engine --test aot_flat_map -- --test-threads=1 | tee /tmp/flatmap-engine.txt
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from run_aot_unit_shard import parse_inventory
          names = parse_inventory(Path('/tmp/flatmap-inventory.txt').read_text())
          summaries = re.findall(
              r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;',
              Path('/tmp/flatmap-engine.txt').read_text(), re.MULTILINE)
          expected = [(str(len(names)), '0', '0', '0', '0')]
          if summaries != expected:
              raise SystemExit(f'incomplete execution: {summaries!r}; expected {expected!r}')
          print(f'Executed all {len(names)} compiled engine regressions')
          PY

      - name: Execute retained flatMap CLI fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-cli --test cli -- array_flat_map --test-threads=2 | tee /tmp/flatmap-cli.txt
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' /tmp/flatmap-cli.txt

      - name: Build the product CLI
        run: cargo build --locked -p lila-cli

      - name: Execute the entire pinned real flatMap subtree
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/lila test262 run built-ins/Array/prototype/flatMap/ --execution-backend wasm --threads 2 --jobs 2 --timeout-ms 60000 --snapshot-dir /tmp/flatmap-test262 --snapshot-name flatmap-ci 2>&1 | tee /tmp/flatmap-test262.txt
          grep -Eq '^total: [1-9][0-9]*$' /tmp/flatmap-test262.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatmap-conformance-evidence
          path: |
            /tmp/flatmap-*.txt
            /tmp/flatmap-test262
          retention-days: 7

  locale-length:
    name: toLocaleString observable length Wasm-AOT conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check formatting and direct/generic ownership
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p lila-aot-wasm --test typed_array_to_locale_string_witness_structure --test to_locale_string_invocation_structure --test array_callback_iteration_structure --test array_flat_map_algorithm_owner_structure --test array_flat_map_typed_array_witness_structure --test array_map_algorithm_owner_structure --test array_filter_algorithm_owner_structure --test array_every_algorithm_owner_structure --test array_some_algorithm_owner_structure
      - name: Execute the complete new engine regression inventory
        run: python3 scripts/run_engine_regression_inventory.py aot_array_to_locale_string_length --output-dir /tmp/locale-length-engine
      - name: Retain the existing CLI fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-cli --test cli -- array::run_wasm_backend_succeeds_for_supported_array_to_locale_string_fixture --exact --test-threads=1 | tee /tmp/locale-length-cli.txt
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' /tmp/locale-length-cli.txt
      - name: Execute the complete pinned real toLocaleString subtree
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p lila-cli
          git rev-parse HEAD > /tmp/locale-length-source-sha.txt
          ./target/debug/lila test262 run built-ins/Array/prototype/toLocaleString/ --execution-backend wasm --threads 2 --jobs 2 --timeout-ms 60000 --snapshot-dir /tmp/locale-length-test262 --snapshot-name locale-length-ci 2>&1 | tee /tmp/locale-length-test262.txt
          grep -Eq '^total: [1-9][0-9]*$' /tmp/locale-length-test262.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locale-length-conformance-evidence
          path: |
            /tmp/locale-length-engine
            /tmp/locale-length-*.txt
            /tmp/locale-length-test262
          retention-days: 7
