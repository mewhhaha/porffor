name: PR19 repair diagnostics
on:
  push:
    branches: [codex/pr19-ci-repair]
    paths: [.github/workflows/pr19-ci-repair.yaml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply the exact guarded compiler repair
        run: |
          python3 .github/pr19-ci-repair.py
          cargo fmt --all
          git diff --check
          git diff --stat
      - name: Retain candidate only on the isolated repair branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/lila-aot-wasm/src/objects.rs crates/lila-aot-wasm/tests/typed_array_to_locale_string_witness_structure.rs crates/lila-engine/tests/aot_array_to_locale_string_length.rs docs/rust-rewrite/aot-array-to-locale-string-length.md
          git commit -m 'fix(objects): observe arguments length descriptors in generic Get'
          git push origin HEAD:refs/heads/codex/pr19-ci-repair
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Check formatting and semantic ownership
        run: |
          cargo fmt --all -- --check
          ./scripts/check-module-boundaries.sh
          cargo test --locked -p lila-aot-wasm --test typed_array_to_locale_string_witness_structure --test to_locale_string_invocation_structure --test array_callback_iteration_structure --test array_flat_map_algorithm_owner_structure --test array_flat_map_typed_array_witness_structure --test array_map_algorithm_owner_structure --test array_filter_algorithm_owner_structure --test array_every_algorithm_owner_structure --test array_some_algorithm_owner_structure
      - name: Build product and retain standalone diagnostic CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p lila-cli
          mkdir -p /tmp/pr19-cli
          cp target/debug/lila /tmp/pr19-cli/lila
          strip /tmp/pr19-cli/lila
          git rev-parse HEAD > /tmp/pr19-cli/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr19-repair-cli
          path: /tmp/pr19-cli
          retention-days: 1
      - name: Execute the complete engine regression inventory
        run: python3 scripts/run_engine_regression_inventory.py aot_array_to_locale_string_length --output-dir /tmp/pr19-engine
      - name: Execute retained CLI fixture
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-cli --test cli -- array::run_wasm_backend_succeeds_for_supported_array_to_locale_string_fixture --exact --test-threads=1 | tee /tmp/pr19-cli-test.txt
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' /tmp/pr19-cli-test.txt
      - name: Execute complete pinned real toLocaleString subtree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/lila test262 run built-ins/Array/prototype/toLocaleString/ --execution-backend wasm --threads 2 --jobs 2 --timeout-ms 60000 --snapshot-dir /tmp/pr19-test262 --snapshot-name pr19-repair 2>&1 | tee /tmp/pr19-test262.txt
          grep -Eq '^total: [1-9][0-9]*$' /tmp/pr19-test262.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr19-repair-evidence
          path: |
            /tmp/pr19-engine
            /tmp/pr19-*.txt
            /tmp/pr19-test262
          retention-days: 7
