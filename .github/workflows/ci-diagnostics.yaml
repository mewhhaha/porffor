name: CI job diagnostics
run-name: CI diagnostics for job ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Completed job whose final diagnostics should be summarized
        required: true
        type: string

permissions:
  actions: read

jobs:
  summarize:
    name: Summarize completed CI job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish bounded job diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9]+$ ]] || { echo 'job_id must be numeric'; exit 2; }
          log="$RUNNER_TEMP/completed-job.log"
          if ! gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > "$log" 2> "$RUNNER_TEMP/log-retrieval.stderr"; then
            python3 -c 'import pathlib,re,sys; s=pathlib.Path(sys.argv[1]).read_text()[:8192]; s=re.sub(r"https?://[^\s\"<>]+", "[redacted URL]", s); s=s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=CI log retrieval failed::"+s)' "$RUNNER_TEMP/log-retrieval.stderr"
            exit 1
          fi
          python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); s=p.read_text(errors="replace"); s=re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", s); s=re.sub(r"[\x00-\x08\x0b-\x1f\x7f-\x9f]", "", s); p.write_text(s)' "$log"
          {
            printf '### Completed job %s diagnostics\n\n```text\n' "$JOB_ID"
            tail -n 200 "$log" | cut -c1-1500
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - "$log" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          pattern = re.compile(r"\berror(?:\[[A-Z][0-9]+\])?:|could not compile|No space left|LLVM ERROR|process didn't exit successfully", re.I)
          indices = [i for i, line in enumerate(lines) if pattern.search(line)]
          blocks = ["\n".join(line[:500] for line in lines[max(0, i-2):i+11])[:3500] for i in indices]
          if not blocks:
              blocks = ["No matching compiler error line found. Final log lines:\n" + "\n".join(lines[-12:])[:3000]]
          for number, block in enumerate(blocks[:12], 1):
              block = block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=Completed job error block {number}::{block}")
          PY
