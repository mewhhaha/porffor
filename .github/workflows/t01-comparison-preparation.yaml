name: T01 comparison preparation
on:
  push:
    branches: [codex/t01-comparison-preparation]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      BASE: 63da499ab52ea6e6c886cfac599569f540f74b1d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean implementation branch without preparation history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t01-comparison-evidence
          cp t01-comparison-proposal.patch /tmp/proposal.patch
          cp crates/lila-test262/tests/snapshot_comparison_identity.rs /tmp/snapshot_comparison_identity.rs
          git checkout --detach "$BASE"
          cp /tmp/snapshot_comparison_identity.rs crates/lila-test262/tests/snapshot_comparison_identity.rs
          git apply --check /tmp/proposal.patch
          git apply /tmp/proposal.patch
          cargo fmt --all
          git diff --check
          ./scripts/check-task-plan.sh
          ./scripts/check-module-boundaries.sh
          git add crates/lila-test262/src/lib.rs crates/lila-test262/tests/snapshot_comparison_identity.rs README.md tasks/README.md tasks/01-baseline-and-generated-backlog.md docs/rust-rewrite/test262-snapshot-comparison.md .github/workflows/snapshot-comparison.yaml
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git -c user.name='ChatGPT' -c user.email='noreply@openai.com' commit -m 'fix(test262): require exact snapshot names for comparison'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git rev-parse HEAD | tee /tmp/t01-comparison-evidence/source-commit.txt
          git rev-parse 'HEAD^{tree}' | tee /tmp/t01-comparison-evidence/source-tree.txt
          git diff "$BASE" HEAD > /tmp/t01-comparison-evidence/proposal.diff
          git archive HEAD crates/lila-test262/src/lib.rs crates/lila-test262/tests/snapshot_comparison_identity.rs README.md tasks/README.md tasks/01-baseline-and-generated-backlog.md docs/rust-rewrite/test262-snapshot-comparison.md .github/workflows/snapshot-comparison.yaml | gzip > /tmp/t01-comparison-evidence/proposal-source.tar.gz
          sha256sum crates/lila-test262/src/lib.rs crates/lila-test262/tests/snapshot_comparison_identity.rs | tee /tmp/t01-comparison-evidence/input-sha256.txt
          git push origin HEAD:refs/heads/codex/fix-test262-comparison-identity
      - name: Reproduce the three original comparison defects
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore crates/lila-test262/src/lib.rs' EXIT
          git show "$BASE":crates/lila-test262/src/lib.rs > crates/lila-test262/src/lib.rs
          set +e
          cargo test --locked -p lila-test262 --test snapshot_comparison_identity -- --test-threads=1 > /tmp/t01-comparison-evidence/baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/t01-comparison-evidence/baseline.log
          test "$status" -eq 101
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path('/tmp/t01-comparison-evidence/baseline.log').read_text()
          results = re.findall(r'^test (\S+) \.\.\. (ok|FAILED)$', output, re.M)
          failures = {name for name, status in results if status == 'FAILED'}
          expected = {'compare_requires_existing_base_name', 'compare_requires_existing_candidate_name', 'compare_rejects_two_missing_names'}
          assert len(results) == 8 and len(dict(results)) == 8, results
          assert failures == expected, failures
          assert '5 passed; 3 failed; 0 ignored;' in output
          assert output.count('an absent comparison input must not alias another run') == 3
          print('Baseline reproduced: exactly 3 identity failures and 5 passing controls.')
          PY
      - name: Run the repaired inventory and retained evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cargo fmt --all -- --check
          cargo test --locked -p lila-test262 --test snapshot_comparison_identity -- --test-threads=1 2>&1 | tee /tmp/t01-comparison-evidence/fixed.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path('/tmp/t01-comparison-evidence/fixed.log').read_text()
          results = re.findall(r'^test (\S+) \.\.\. (ok|FAILED|ignored)$', output, re.M)
          assert len(results) == 8 and len(dict(results)) == 8, results
          assert all(status == 'ok' for _, status in results), results
          assert '8 passed; 0 failed; 0 ignored;' in output
          print('Fixed: complete 8/8 identity inventory passed without ignores.')
          PY
          cargo test --locked -p lila-test262 --test snapshot_use_structure --test aggregate_evidence_requirement_structure --test execution_identity_structure 2>&1 | tee /tmp/t01-comparison-evidence/structure.log
          cargo xc 2>&1 | tee /tmp/t01-comparison-evidence/workspace-check.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t01-comparison-preparation
          path: /tmp/t01-comparison-evidence
          if-no-files-found: error
          retention-days: 7
