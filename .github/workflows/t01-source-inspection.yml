name: T01 source inspection
on:
  push:
    branches: [codex/t01-source-inspection-20260906]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63da499ab52ea6e6c886cfac599569f540f74b1d
          persist-credentials: false
      - name: Export committed source only
        run: |
          mkdir -p /tmp/t01-source
          git rev-parse HEAD | tee /tmp/t01-source/source-commit.txt
          git archive --format=tar.gz HEAD > /tmp/t01-source/source.tar.gz
          sha256sum /tmp/t01-source/source.tar.gz | tee /tmp/t01-source/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: t01-baseline-source
          path: /tmp/t01-source/
          retention-days: 3
          if-no-files-found: error
