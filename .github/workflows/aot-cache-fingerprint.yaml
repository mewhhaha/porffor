name: AOT compiler cache identity

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/limited_verification.py'
      - '.github/workflows/aot-cache-fingerprint.yaml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/limited_verification.py'
      - '.github/workflows/aot-cache-fingerprint.yaml'

permissions:
  contents: read

concurrency:
  group: aot-cache-fingerprint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aot-correctness
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run compiler fingerprint regressions
        run: cargo test --locked -p lila-engine --test structure -- compiler_fingerprint::

  persistence:
    needs: fingerprint
    # Match differential-corpus: this host provides a cgroup-v2 systemd user
    # manager, and limited_verification.py rejects uncapped execution.
    runs-on: [self-hosted, linux, lila-conformance]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      LILA_JOBS: '1'
      RUST_TEST_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aot-correctness
      - name: Run vendored Wasmtime compiler identity regressions
        shell: bash
        env:
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/vendor/wasmtime-internal-cache-47.0.0
          CARGO_PKG_VERSION: '47.0.0'
        run: |
          python3 scripts/limited_verification.py --memory-mib 4096 -- rustc --edition 2024 --test vendor/wasmtime-internal-cache-47.0.0/tests/compiler_identity.rs -o "${{ runner.temp }}/wasmtime-cache-compiler-identity"
          python3 scripts/limited_verification.py --memory-mib 4096 -- "${{ runner.temp }}/wasmtime-cache-compiler-identity" --test-threads=1
      - name: Run raw and native runtime cache process regressions
        run: >-
          python3 scripts/limited_verification.py --memory-mib 4096 --
          cargo test --locked -p lila-engine
          --test runtime_cache
          -- runtime_artifact_cache:: --test-threads=1
