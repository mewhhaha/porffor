name: Array callback conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: array-callback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Shared Array callback Wasm-AOT regressions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting and semantic owners
        run: |
          cargo fmt --all -- --check
          scripts/check-runtime-heap-policy.sh
      - name: Verify complete-inventory runner contracts
        run: python3 scripts/test_run_rust_test_inventory.py
      - name: Execute every engine regression in a bounded process
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/array-callback-engine
          cargo test --locked -p lila-engine --test wasm_aot_core array_callback -- --list \
            | tee /tmp/array-callback-engine/inventory.txt
          python3 scripts/run_rust_test_inventory.py --inventory /tmp/array-callback-engine/inventory.txt \
            --log-dir /tmp/array-callback-engine/logs --timeout-seconds 300 -- \
            cargo test --locked -p lila-engine --test wasm_aot_core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: array-callback-engine-evidence
          path: /tmp/array-callback-engine
          retention-days: 7
          if-no-files-found: error

  cli-regressions:
    name: Retained CLI fixtures (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [array, typed_array]
    env:
      CARGO_BUILD_JOBS: '2'
      LILA_CACHE_LIMIT_BYTES: '2147483648'
      LILA_FUNCTION_CACHE_LIMIT_BYTES: '2147483648'
      LILA_MODULE_CACHE_LIMIT_BYTES: '33554432'
      LILA_PROGRAM_CACHE_LIMIT_BYTES: '8388608'
      LILA_MODULE_MEMORY_CACHE_ENTRIES: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete partition coverage and execute every selected CLI test
        shell: bash
        env:
          CLI_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          log_dir="/tmp/array-callback-cli-$CLI_FAMILY"
          mkdir -p "$log_dir"
          cargo test --locked -p lila-cli --test cli "cli_tests::wasm_aot::${CLI_FAMILY}::" -- --list \
            > "$log_dir/inventory.txt"
          sed -n 's/: test$//p' "$log_dir/inventory.txt" | sort -u > "$log_dir/all.txt"
          test -s "$log_dir/all.txt"
          case "$CLI_FAMILY" in
            array)
              grep -E '::wasm_aot::array::(callback|callback_abrupt_indices|mutation|probes)::' "$log_dir/all.txt" > "$log_dir/callbacks.txt"
              grep -E '::wasm_aot::array::(array_from|array_from_close|array_from_descriptors|array_from_observability|array_species|array_species_edges)::' "$log_dir/all.txt" > "$log_dir/construction.txt"
              ;;
            typed_array)
              grep -E '::wasm_aot::typed_array::(array_from|array_from_iterable|basics|constructors|dataview|dataview_float16|float16array)::' "$log_dir/all.txt" > "$log_dir/callbacks.txt"
              grep -E '::wasm_aot::typed_array::(from_order|from_overrides|higher_order|higher_order_loops|integer_indexed|join|resize|set|set_bounds|species_sort|view_types)::' "$log_dir/all.txt" > "$log_dir/construction.txt"
              ;;
          esac
          cat "$log_dir/callbacks.txt" "$log_dir/construction.txt" | sort -u > "$log_dir/focused.txt"
          comm -23 "$log_dir/all.txt" "$log_dir/focused.txt" > "$log_dir/remaining.txt"
          cat "$log_dir/callbacks.txt" "$log_dir/construction.txt" "$log_dir/remaining.txt" | sort > "$log_dir/union.txt"
          cmp "$log_dir/all.txt" "$log_dir/union.txt"
          test -z "$(uniq -d "$log_dir/union.txt")"
          for shard in callbacks construction remaining; do
            test -s "$log_dir/$shard.txt"
            : > "$log_dir/$shard.executed.txt"
            while IFS= read -r test_name; do
              safe_name=$(printf '%s' "$test_name" | tr ':/' '__')
              if ! cargo test --locked -p lila-cli --test cli "$test_name" -- --exact --nocapture --test-threads=1 > "$log_dir/$safe_name.log" 2>&1; then
                cat "$log_dir/$safe_name.log"
                exit 1
              fi
              grep -Fx "test $test_name ... ok" "$log_dir/$safe_name.log"
              grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log_dir/$safe_name.log"
              printf '%s\n' "$test_name" >> "$log_dir/$shard.executed.txt"
            done < "$log_dir/$shard.txt"
            cmp "$log_dir/$shard.txt" "$log_dir/$shard.executed.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: array-callback-cli-${{ matrix.family }}-evidence
          path: /tmp/array-callback-cli-${{ matrix.family }}
          retention-days: 7
          if-no-files-found: error

  build-test262-cli:
    name: Build the callback conformance product
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Build once for every pinned real subtree shard
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p lila-cli
          git rev-parse HEAD > target/debug/callback-source-sha.txt
          (cd target/debug && sha256sum lila > callback-binary-sha256.txt)
          tar -czf /tmp/callback-test262-cli.tar.gz -C target/debug lila callback-source-sha.txt callback-binary-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: array-callback-test262-cli
          path: /tmp/callback-test262-cli.tar.gz
          retention-days: 7
          if-no-files-found: error

  real-subtrees:
    name: Pinned real Array ${{ matrix.method }} (${{ matrix.shard }}/4)
    needs: build-test262-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        method: [map, filter, every, some]
        shard: [1, 2, 3, 4]
    env:
      ARRAY_METHOD: ${{ matrix.method }}
      ARRAY_SHARD: ${{ matrix.shard }}
      CARGO_BUILD_JOBS: '2'
      LILA_CACHE_LIMIT_BYTES: '2147483648'
      LILA_FUNCTION_CACHE_LIMIT_BYTES: '2147483648'
      LILA_MODULE_CACHE_LIMIT_BYTES: '33554432'
      LILA_PROGRAM_CACHE_LIMIT_BYTES: '8388608'
      LILA_MODULE_MEMORY_CACHE_ENTRIES: '2'
      LILA_MODULE_MEMORY_CACHE_BYTES: '33554432'
      LILA_MODULE_BUILD_JOBS: '1'
      LILA_MODULE_SERIALIZE_MB: '8'
      LILA_TEST262_FORCE_CASE_RUNNER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: array-callback-test262-cli
          path: /tmp/callback-product
      - name: Verify and unpack the exact product revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf /tmp/callback-product/callback-test262-cli.tar.gz -C target/debug
          chmod +x target/debug/lila
          test "$(cat target/debug/callback-source-sha.txt)" = "$(git rev-parse HEAD)"
          (cd target/debug && sha256sum --check callback-binary-sha256.txt)
      - name: Verify exact-denominator and failure-bucket controls
        run: python3 -m unittest discover -s scripts/tests -p test_test262_shard_report.py -v
      - name: Execute a complete disjoint share of the pinned real subtree
        shell: bash
        run: |
          set -euo pipefail
          filter="built-ins/Array/prototype/$ARRAY_METHOD"
          ./target/debug/lila test262 list "$filter" \
            | tee /tmp/callback-inventory.txt
          ./target/debug/lila test262 shard "$ARRAY_SHARD/4" "$filter" \
            --execution-backend wasm --threads 2 --jobs 2 --timeout-ms 60000 \
            --snapshot-dir /tmp/callback-test262 --snapshot-name "$ARRAY_METHOD-ci-$ARRAY_SHARD" \
            | tee /tmp/callback-test262.txt
          python3 scripts/check-test262-shard-report.py --inventory /tmp/callback-inventory.txt --report /tmp/callback-test262.txt --shard "$ARRAY_SHARD/4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: array-${{ matrix.method }}-shard-${{ matrix.shard }}-real-evidence
          path: |
            /tmp/callback-inventory.txt
            /tmp/callback-test262.txt
            /tmp/callback-test262
            target/debug/callback-source-sha.txt
            target/debug/callback-binary-sha256.txt
          retention-days: 7
          if-no-files-found: error
