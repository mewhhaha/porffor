name: AOT module path identity

on:
  pull_request:
    paths:
      - '.github/actions/rust-verification/**'
      - 'crates/scriptw-engine/**'
      - '.github/workflows/aot-module-paths.yaml'
  push:
    branches: [main]
    paths:
      - '.github/actions/rust-verification/**'
      - 'crates/scriptw-engine/**'
      - '.github/workflows/aot-module-paths.yaml'

permissions:
  contents: read

concurrency:
  group: aot-module-paths-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test the consumed path normalizer without building the compiler
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test crates/scriptw-engine/src/module_paths.rs -o /tmp/scriptw-module-path-tests
          /tmp/scriptw-module-path-tests --list | tee /tmp/module-path-inventory.txt
          grep -Fxq 'tests::lexical_parent_precedes_symlink_resolution: test' /tmp/module-path-inventory.txt
          /tmp/scriptw-module-path-tests
      - uses: ./.github/actions/rust-verification
        with:
          shared-key: aot-correctness
      - name: Test module loader integration
        run: >-
          cargo test --locked -p scriptw-engine --lib module_loader::
