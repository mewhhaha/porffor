# Temporary PR-scoped repair runner; removed before the final review commit.
name: PR9 repair diagnostics

on:
  push:
    branches: [codex/aot-control-flow-review]
    paths: [.github/workflows/pr9-repair.yaml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'mewhhaha/porffor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Bound the Promise router audit by its own method body
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('crates/lila-aot-wasm/src/heap.rs')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == '532c6596871b98d83ebcfc2d5b9a1c3a3cc71b26'
          text = path.read_text()
          old = '.split_once("fn emit_intrinsic_promise_resolve_to_locals(")\n            .expect("Promise reaction router should have a stable boundary")'
          new = '.split_once("\\n    }\\n")\n            .expect("Promise reaction router must end at its method-level closing brace")'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
      - name: Format and publish only the reviewed audit repair
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 crates/lila-aot-wasm/src/heap.rs
          git diff --check
          git diff -- crates/lila-aot-wasm/src/heap.rs
          git add crates/lila-aot-wasm/src/heap.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(test): keep Promise router ownership audit within its method'
          git push origin HEAD:refs/heads/codex/aot-control-flow-review
