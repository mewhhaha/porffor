# Temporary PR-scoped repair runner; removed before the final review commit.
name: PR9 repair diagnostics

on:
  push:
    branches: [codex/aot-control-flow-review]
    paths: [.github/workflows/pr9-repair.yaml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'mewhhaha/porffor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restore stable literal offsets and register the verdict test target
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace_once(text, old, new):
              assert text.count(old) == 1, repr(old)
              return text.replace(old, new, 1)

          path = Path('crates/lila-aot-wasm/src/data.rs')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == '174acc2c511b3a8a3653a1693a650289084ba6b3'
          text = replace_once(path.read_text(), '            UNHANDLED_REJECTION_TOSTRING_THROWN_MESSAGE,\n', '')
          text = replace_once(text, '        // Unconditional, and it must stay unconditional: these are the messages', '        // Keep diagnostics after the fixed literal seed: inserting them into\n        // its prefix changes every following packed string offset.\n        pool.intern_string(UNHANDLED_REJECTION_TOSTRING_THROWN_MESSAGE);\n        // Unconditional, and it must stay unconditional: these are the messages')
          test = '''    #[test]
              fn rejection_diagnostic_is_interned_without_moving_fixed_literals() {
                  let pool = production_pool_for_an_empty_script();
                  assert_eq!(
                      pool.payload(","),
                      ((((STATIC_DATA_OFFSET as u64) + 14) << 32) | 1) as i64,
                  );
                  let message = UNHANDLED_REJECTION_TOSTRING_THROWN_MESSAGE;
                  let payload = pool.payload(message) as u64;
                  let offset = (payload >> 32) as usize - STATIC_DATA_OFFSET as usize;
                  let len = (payload & 0xFFFF_FFFF) as usize;
                  assert_eq!(&pool.bytes[offset..offset + len], message.as_bytes());
              }

          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.split('\n'))
          text = replace_once(text, '    #[test]\n    fn every_runtime_error_message_literal_resolves_to_a_payload()', test + '    #[test]\n    fn every_runtime_error_message_literal_resolves_to_a_payload()')
          path.write_text(text)

          path = Path('crates/lila-cli/tests/cli/known_failures.rs')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == 'a31a465ff2c80fb26ba76cb002e0dc37a5498558'
          text = replace_once(path.read_text(), '    /// `tests/perf.rs`.\n    Perf,', '    /// `tests/perf.rs`.\n    Perf,\n    /// `tests/test262_verdict_command_structure.rs`.\n    Test262VerdictCommandStructure,')
          text = replace_once(text, '            TestTarget::Perf => "perf",', '            TestTarget::Perf => "perf",\n            TestTarget::Test262VerdictCommandStructure => "test262_verdict_command_structure",')
          text = replace_once(text, '            "perf" => Some(TestTarget::Perf),', '            "perf" => Some(TestTarget::Perf),\n            "test262_verdict_command_structure" => Some(TestTarget::Test262VerdictCommandStructure),')
          text = replace_once(text, '            "perf" => Ok(TestTarget::Perf),', '            "perf" => Ok(TestTarget::Perf),\n            "test262_verdict_command_structure" => Ok(TestTarget::Test262VerdictCommandStructure),')
          path.write_text(text)
      - name: Format and publish only the reviewed files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 crates/lila-aot-wasm/src/data.rs crates/lila-cli/tests/cli/known_failures.rs
          git diff --check
          git diff -- crates/lila-aot-wasm/src/data.rs crates/lila-cli/tests/cli/known_failures.rs
          git add crates/lila-aot-wasm/src/data.rs crates/lila-cli/tests/cli/known_failures.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ci): preserve fixed string offsets and audit verdict command tests'
          git push origin HEAD:refs/heads/codex/aot-control-flow-review
      - name: Verify fixed string layout and RegExp data regressions
        run: >-
          cargo test --locked -p lila-aot-wasm --lib --
          data::runtime_error_message_pool_tests::rejection_diagnostic_is_interned_without_moving_fixed_literals
          tests::preseeded_string_bytes_and_literal_payloads_are_stable
          tests::regexp_program_data_is_aligned_deduplicated_and_before_the_heap
          --exact --nocapture --test-threads=1
      - name: Verify the complete CLI ledger and registered structural test targets
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p lila-cli --test cli -- known_failures:: --test-threads=2
          cargo test --locked -p lila-cli --test cli_output_ending_structure --test test262_verdict_command_structure
