# Temporary PR-scoped repair runner; removed before the final review commit.
name: PR9 repair diagnostics

on:
  push:
    branches: [codex/aot-control-flow-review]
    paths: [.github/workflows/pr9-repair.yaml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'mewhhaha/porffor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Preserve elided for-await head storage across suspension
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('crates/lila-ir/src/lowering/for_of.rs')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == '9b2409220646c9930c6143042356d7d5917faa38'
          text = path.read_text()
          old = '''                    |(entry_state, value_resume_state, close_resume_state, exit_state)| {
                                  // Allocation order is load-bearing:'''
          old = old.replace('                                  //', '                        //')
          new = '''                    |(entry_state, value_resume_state, close_resume_state, exit_state)| {
                                  // An uncaptured lexical head has no materialized iteration
                                  // environment. Analysis therefore does not place its alias
                                  // in the root activation, but the body can still read it on
                                  // a later resume. Retain that cell alongside the Iterator
                                  // Record, without duplicating a captured iteration cell.
                                  if lexical_environment
                                      .as_ref()
                                      .and_then(|environment| environment.iteration_environment.as_ref())
                                      .is_none()
                                  {
                                      self.add_suspension_owned_binding(storage_name.clone());
                                  }
                                  // Allocation order is load-bearing:'''
          new = new.replace('                                  ', '                        ')
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
      - name: Format and publish the reviewed compiler repair
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 crates/lila-ir/src/lowering/for_of.rs crates/lila-ir/tests/async_for_of_activation.rs crates/lila-engine/tests/aot_async_for_of.rs
          git diff --check
          git diff -- crates/lila-ir/src/lowering/for_of.rs
          git add crates/lila-ir/src/lowering/for_of.rs crates/lila-ir/tests/async_for_of_activation.rs crates/lila-engine/tests/aot_async_for_of.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ir): retain uncaptured for-await head values across suspension'
          git push origin HEAD:refs/heads/codex/aot-control-flow-review
      - name: Test activation-slot planning
        if: ${{ !cancelled() }}
        run: cargo test --locked -p lila-ir --test async_for_of_activation -- --nocapture
      - name: Verify the backend failures found by the full-suite run
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked -p lila-aot-wasm --lib --
          data::runtime_error_message_pool_tests::the_runtime_error_message_table_is_sorted_and_unique
          heap::tests::promise_lifecycle_owns_every_raw_state_access
          heap::tests::async_function_resume_completion_owns_every_raw_access
          tests::async_generator_for_await_with_a_suspending_body_modules_validate
          --exact --nocapture --test-threads=1
