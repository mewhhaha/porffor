# Temporary PR-scoped repair runner; removed before the final review commit.
name: PR9 repair diagnostics

on:
  push:
    branches: [codex/aot-control-flow-review]
    paths: [.github/workflows/pr9-repair.yaml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'mewhhaha/porffor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Repair the source-audit implementation boundary
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('crates/lila-aot-wasm/src/heap.rs')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == 'd3779b5f2be7daafd04ee03e624a4b203467be5f'
          text = path.read_text()
          assert text.count('#[cfg(test)]\nmod tests {') == 1
          old = '.split_once("#[cfg(test)]")\n            .expect("heap tests should follow the implementation")'
          new = '.split_once("#[cfg(test)]\\nmod tests {")\n            .expect("heap test module should follow the implementation, including test-only imports")'
          assert text.count(old) == 2
          path.write_text(text.replace(old, new))
      - name: Format and publish the reviewed heap audit repair
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 crates/lila-aot-wasm/src/heap.rs
          git diff --check
          git diff -- crates/lila-aot-wasm/src/heap.rs
          git add crates/lila-aot-wasm/src/heap.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(test): audit heap implementation past test-only imports'
          git push origin HEAD:refs/heads/codex/aot-control-flow-review

  inspect:
    if: github.repository == 'mewhhaha/porffor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect suspension binding storage
        shell: python
        run: |
          from pathlib import Path
          needles = ['does not survive a suspension', 'enum BindingStorage', 'fn wasm_agents_run_test262_wait_until_with_exact_assertions']
          for root in ['crates/lila-aot-wasm/src', 'crates/lila-ir/src', 'crates/lila-test262/src', 'crates/lila-test262/tests']:
              for path in Path(root).rglob('*.rs'):
                  lines = path.read_text().splitlines()
                  for i, line in enumerate(lines):
                      if any(needle in line for needle in needles):
                          print(f'=== {path}:{i + 1} ===', flush=True)
                          for j in range(max(0, i - 80), min(len(lines), i + 60)):
                              print(f'{j + 1}: {lines[j]}', flush=True)
      - name: Package compiler sources for static review
        run: tar -czf source-review.tar.gz crates/lila-aot-wasm/src crates/lila-ir/src crates/lila-engine/src Cargo.toml README.md
      - uses: actions/upload-artifact@v4
        with:
          name: source-review
          path: source-review.tar.gz
          retention-days: 1
