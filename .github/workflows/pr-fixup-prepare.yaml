name: Temporary PR integration preparation

on:
  push:
    branches: [codex/pr-fixup-workbench-20260906]
    paths: [.github/workflows/pr-fixup-prepare.yaml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'mewhhaha/porffor' && github.ref == 'refs/heads/codex/pr-fixup-workbench-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PROPOSAL: 2c5e139394abea434a23616ba817bceb7d632e37
      INTEGRATE: acdd0d1aba6e53b9ed65ed42d16bfe953b454221
      ORIGINAL_WORKFLOW: 2aa555559feba1271fed336610f64f0fc51c29d1
      CANDIDATE: codex/pr-fixup-candidate-20260906
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c5e139394abea434a23616ba817bceb7d632e37
          fetch-depth: 32
          persist-credentials: false
      - name: Apply the immutable reviewed reconciliation script
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ORIGINAL_WORKFLOW"
          git show "$ORIGINAL_WORKFLOW:.github/workflows/pr-fixup-prepare.yaml" > /tmp/original-pr-fixup.yaml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/original-pr-fixup.yaml').read_text()
          start = '      - name: Reconcile the pinned proposals without rewriting either history\n'
          end = '      - name: Format and execute complete retained ownership targets\n'
          assert text.count(start) == text.count(end) == 1
          block = text.split(start, 1)[1].split(end, 1)[0].split('        run: |\n', 1)[1]
          lines = block.splitlines()
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          Path('/tmp/reconcile-prs.sh').write_text('\n'.join(line[10:] if line.strip() else '' for line in lines) + '\n')
          PY
          bash /tmp/reconcile-prs.sh
      - name: Format and execute every retained ownership target
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git add -u
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          mkdir -p /tmp/pr-fixup-evidence
          git diff --cached --stat > /tmp/pr-fixup-evidence/stat.txt
          git diff --cached > /tmp/pr-fixup-evidence/integration.patch
          tar -czf /tmp/pr-fixup-evidence/review-sources.tar.gz crates scripts Cargo.toml Cargo.lock README.md .github/workflows
          export CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/crates/lila-aot-wasm"
          status=0
          for test in typed_array_to_locale_string_witness_structure to_locale_string_invocation_structure array_callback_iteration_structure array_flat_map_algorithm_owner_structure array_flat_map_typed_array_witness_structure array_map_algorithm_owner_structure array_filter_algorithm_owner_structure array_every_algorithm_owner_structure array_some_algorithm_owner_structure array_to_locale_string_observable_structure; do
            log="/tmp/pr-fixup-evidence/$test.txt"
            if rustc --edition=2024 --test "crates/lila-aot-wasm/tests/$test.rs" -o "/tmp/$test" > "$log" 2>&1 && "/tmp/$test" --test-threads=1 >> "$log" 2>&1; then
              echo "PASS: $test"
            else
              status=1
              echo "FAIL: $test"
            fi
            cat "$log"
          done
          test "$status" -eq 0
          test ! -e .github/workflows/pr-fixup-prepare.yaml
          git commit -m 'fix(array): reconcile observable locale invocation with shared length and iterator repairs'
          git merge-base --is-ancestor "$PROPOSAL" HEAD
          git merge-base --is-ancestor "$INTEGRATE" HEAD
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > /tmp/pr-fixup-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > /tmp/pr-fixup-evidence/tree-sha.txt
      - name: Publish candidate only for separately reviewed PR ref update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$CANDIDATE"
          unset auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-fixup-preparation-evidence
          path: /tmp/pr-fixup-evidence
          retention-days: 7
