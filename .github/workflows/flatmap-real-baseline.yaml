name: Pinned flatMap real baseline
on:
  push:
    branches: [codex/flatmap-real-baseline]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 31c89c4b29b1fe84e3a3eaef55312448b80e3f07
          persist-credentials: false
      - run: cargo build --locked -p lila-cli
      - name: Run the entire unchanged pinned flatMap subtree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/flatmap-baseline-commit.txt
          ./target/debug/lila test262 run built-ins/Array/prototype/flatMap/ --execution-backend wasm --threads 2 --jobs 2 --timeout-ms 60000 --snapshot-dir /tmp/flatmap-real-baseline --snapshot-name flatmap-baseline 2>&1 | tee /tmp/flatmap-real-baseline.log
          grep -Eq '^total: [1-9][0-9]*$' /tmp/flatmap-real-baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatmap-real-baseline
          path: |
            /tmp/flatmap-baseline-commit.txt
            /tmp/flatmap-real-baseline.log
            /tmp/flatmap-real-baseline
          retention-days: 7
