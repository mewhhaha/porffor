name: Bound function verification workspace

on:
  push:
    branches:
      - codex/complete-bound-function-semantics

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact source revision for verification
        run: git archive --format=tar.gz HEAD -o /tmp/lila-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bound-function-source-${{ github.sha }}
          path: /tmp/lila-source.tar.gz
          if-no-files-found: error
          retention-days: 1
