name: AOT control-flow regressions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aot-control-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aot-control-flow:
    name: AOT emission and execution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test complete-inventory sharding
        run: python3 -m unittest discover -s scripts/tests -p test_run_aot_unit_shard.py -v

      - name: Test for-await activation planning
        if: ${{ !cancelled() }}
        run: cargo test --locked -p lila-ir --test async_for_of_activation

      - name: Test emission invariants
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-aot-wasm --lib code_sink:: -- --list | tee /tmp/aot-emission-tests.txt
          grep -q '^code_sink::tests::a_sibling_cannot_resurrect_a_closed_label: test$' /tmp/aot-emission-tests.txt
          cargo test --locked -p lila-aot-wasm --lib code_sink:: -- --test-threads=1

      - name: Audit compiled product artifact
        if: ${{ !cancelled() }}
        run: cargo test --locked -p lila-aot-wasm --test product_artifact -- --test-threads=1

      - name: Execute control-flow and suspension regressions through Wasmtime
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test --locked -p lila-engine --test aot_control_flow --test aot_async_for_of -- --test-threads=1

      - name: Execute suspended Reference regressions through Wasmtime
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test --locked -p lila-engine --test aot_suspended_references -- --test-threads=1

      - name: Execute captured for-await environment regressions through Wasmtime
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test --locked -p lila-engine --test aot_captured_for_await -- --test-threads=1

  aot-backend:
    name: Complete AOT backend (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute every test assigned from the compiled inventory
        run: python3 scripts/run_aot_unit_shard.py ${{ matrix.shard }} 8
