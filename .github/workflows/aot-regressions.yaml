name: AOT control-flow regressions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aot-control-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aot-control-flow:
    name: AOT emission and execution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check changed Rust formatting
        run: >-
          rustfmt --edition 2021 --check
          crates/lila-aot-wasm/src/code_sink.rs
          crates/lila-engine/tests/aot_control_flow.rs

      - name: Test emission invariants
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-aot-wasm --lib code_sink:: -- --list | tee /tmp/aot-emission-tests.txt
          grep -q '^code_sink::tests::a_sibling_cannot_resurrect_a_closed_label: test$' /tmp/aot-emission-tests.txt
          cargo test --locked -p lila-aot-wasm --lib code_sink:: -- --test-threads=1

      - name: Audit compiled product artifact
        if: ${{ !cancelled() }}
        run: cargo test --locked -p lila-aot-wasm --test product_artifact -- --test-threads=1

      - name: Execute abrupt-completion regressions through Wasmtime
        if: ${{ !cancelled() }}
        run: cargo test --locked -p lila-engine --test aot_control_flow -- --test-threads=1
