name: Callback descriptor review
on:
  push:
    branches: [codex/array-callback-prepare]
    paths: [.github/workflows/callback-descriptor-review.yaml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 436527ccf2d2c2e27c994b15fac9ed86ec0b765b
      - name: Add the exact review regression before changing the compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/lila-engine/tests/aot_array_callback_iteration.rs)" = ff6b52e7465e007a5219944870111d3764c13fa3
          cat >> crates/lila-engine/tests/aot_array_callback_iteration.rs <<'RS'

          #[test]
          fn internal_result_descriptors_ignore_inherited_get_and_set() {
              assert_wasm_true(
                  r#"
          var methods = [Array.prototype.map, Array.prototype.filter, Array.prototype.flatMap];
          var fields = ['get', 'set'], ok = true, reads = 0, marker = {};
          for (var f = 0; f < fields.length; f++) {
            Object.defineProperty(Object.prototype, fields[f], {
              configurable: true,
              get: function() { reads++; throw marker; }
            });
            try {
              for (var m = 0; m < methods.length; m++) {
                for (var custom = 0; custom < 2; custom++) {
                  var source = [2, 3], target = [];
                  if (custom) source.constructor = { [Symbol.species]: function() { return target; } };
                  var result = methods[m].call(source, function(value) { return value + 1; });
                  ok = ok && result.length === 2 && result[0] === (m === 1 ? 2 : 3) && result[1] === (m === 1 ? 3 : 4);
                  if (custom) ok = ok && result === target;
                }
              }
            } catch (error) { ok = false; }
            finally { delete Object.prototype[fields[f]]; }
          }
          ok && reads === 0;
          "#,
              );
          }
          RS
          mkdir -p /tmp/descriptor-review
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('crates/lila-engine/tests/aot_array_callback_iteration.rs').read_text()
          programs = re.findall(r'r#"(.*?)"#', source, re.S)
          assert len(programs) == 21
          Path('/tmp/descriptor-review/regression.js').write_text(programs[-1])
          PY
          node - <<'JS'
          const fs = require('fs'), vm = require('vm');
          if (vm.runInNewContext(fs.readFileSync('/tmp/descriptor-review/regression.js', 'utf8')) !== true) throw new Error('invalid reference expectation');
          console.log('Reference expectation: true');
          JS
      - name: Confirm the regression fails on the original PR compiler
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --locked -p lila-engine --test aot_array_callback_iteration internal_result_descriptors_ignore_inherited_get_and_set -- --exact --nocapture --test-threads=1 > /tmp/descriptor-review/before.txt 2>&1
          result=$?
          set -e
          cat /tmp/descriptor-review/before.txt
          test "$result" -ne 0
          grep -Eq '^test result: FAILED\. 0 passed; 1 failed; 0 ignored;' /tmp/descriptor-review/before.txt
      - name: Apply the narrowly scoped reviewed fix and its guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('crates/lila-aot-wasm/src/builtins/array.rs')
          source = path.read_text()
          assert hashlib.sha256(source.encode()).hexdigest() == '540a4cb0b347cf1acabb54c44aaaeec60e9dd08bb87db949412b7e721e2eb594'
          start = source.index('    fn emit_array_target_create_data_property_or_throw(')
          end = source.index('    pub(crate) fn compile_array_prototype_fill_builtin(', start)
          body = source[start:end]
          old = '        self.emit_alloc_plain_object_with_prototype(\n            None,\n            Some(OBJECT_PROTOTYPE_GLOBAL_INDEX),\n            function,\n        )?;'
          assert body.count(old) == 1
          new = ('        // This carrier is internal to CreateDataProperty, not a public\n'
                 '        // FromPropertyDescriptor result. Inherited get/set properties must\n'
                 '        // not participate when ObjectDefineProperty consumes its fields.\n'
                 '        self.emit_alloc_plain_object_with_prototype(None, None, function)?;')
          path.write_text(source[:start] + body.replace(old, new) + source[end:])
          path = Path('crates/lila-aot-wasm/tests/array_callback_iteration_structure.rs')
          source = path.read_text()
          source += '''
          #[test]
          fn internal_array_result_descriptor_has_no_observable_prototype() {
              let body = bounded(
                  ARRAY_SOURCE,
                  "fn emit_array_target_create_data_property_or_throw(",
                  "pub(crate) fn compile_array_prototype_fill_builtin(",
              );
              assert!(body.contains("self.emit_alloc_plain_object_with_prototype(None, None, function)"));
              assert!(!body.contains("OBJECT_PROTOTYPE_GLOBAL_INDEX"));
          }
          '''
          path.write_text(source)
          path = Path('docs/rust-rewrite/aot-array-callback-iteration.md')
          source = path.read_text()
          assert source.count('contains 20 regression') == 1
          source = source.replace('contains 20 regression', 'contains 21 regression')
          source = source.replace('## Review findings and next work\n', '''## Review findings and next work

          Review found a pre-existing bug in the shared Array-result definition helper:
          its internal descriptor carrier inherited Object.prototype, exposing inherited
          `get`/`set` getters during ObjectDefineProperty conversion. Reusing it would
          also regress map/filter. The carrier now has a null prototype; public
          FromPropertyDescriptor objects and Proxy trap descriptors are unchanged.
          A regression covers both inherited field names across map/filter/flatMap,
          with both default and custom Array species results, and a structural guard
          pins the internal carrier's isolation.
          ''')
          path.write_text(source)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Verify the complete corrected engine inventory and structural contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_engine_regression_inventory.py aot_array_callback_iteration --output-dir /tmp/descriptor-review/engine
          cargo test --locked -p lila-aot-wasm --test array_callback_iteration_structure --test array_map_algorithm_owner_structure --test array_filter_algorithm_owner_structure --test array_every_algorithm_owner_structure --test array_some_algorithm_owner_structure --test array_species_create_operation_evidence_structure --test typed_array_quantifier_family_witness_structure 2>&1 | tee /tmp/descriptor-review/structure.txt
          python3 scripts/tests/test_engine_regression_inventory.py
      - name: Publish only the verified source changes to the review branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'mewhhaha'
          git config user.email '3399205+mewhhaha@users.noreply.github.com'
          git add crates/lila-aot-wasm/src/builtins/array.rs crates/lila-aot-wasm/tests/array_callback_iteration_structure.rs crates/lila-engine/tests/aot_array_callback_iteration.rs docs/rust-rewrite/aot-array-callback-iteration.md
          git commit -m 'fix(array): isolate internal result descriptors from inherited accessors'
          git rev-parse HEAD | tee /tmp/descriptor-review/verified-commit.txt
          git push origin HEAD:refs/heads/codex/array-callback-descriptor-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: callback-descriptor-review-evidence
          path: /tmp/descriptor-review
          retention-days: 7
