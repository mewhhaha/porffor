name: Apply captured for-await draft patch

on:
  push:
    branches: [codex/aot-for-await-captured-environments]
    paths: [.github/workflows/aot-apply-environments.yaml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'mewhhaha/porffor' && github.ref == 'refs/heads/codex/aot-for-await-captured-environments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed source patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 584a54f076cb122d984d4aa6b6a04f584d624486
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          data = '''?'''
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2ecd634e73bcfe2ae3184d821f7e21eecb72d6ccddb494b5171be08517efe580'
          Path('/tmp/aot-environments.patch').write_bytes(patch)
          PY
          git apply --index /tmp/aot-environments.patch
          git rm .github/workflows/aot-apply-environments.yaml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve captured for-await environments across AOT suspension'
          git push origin HEAD:refs/heads/codex/aot-for-await-captured-environments
