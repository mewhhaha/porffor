name: Apply captured for-await draft patch

on:
  push:
    branches: [codex/aot-for-await-captured-environments]
    paths: [.github/workflows/aot-apply-environments.yaml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'mewhhaha/porffor' && github.ref == 'refs/heads/codex/aot-for-await-captured-environments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checked source patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          base = '584a54f076cb122d984d4aa6b6a04f584d624486'
          chunks = [Path(f'scripts/aot-env-{i}.txt') for i in range(6)]
          allowed = {str(path) for path in chunks} | {'.github/workflows/aot-apply-environments.yaml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD']).decode().splitlines())
          assert changed == allowed, changed
          encoded = ''.join(''.join(path.read_text().split()) for path in chunks)
          encoded = encoded.replace('Zwe6iMf6e', 'Zwe6igf6e')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4d0f45df57221b41f302ef1e96d52ec8647ad59f0603b4d270c4f91c536020c9'
          Path('/tmp/aot-environments.patch').write_bytes(patch)
          PY
          git apply --check /tmp/aot-environments.patch
          git apply --index /tmp/aot-environments.patch
          git rm .github/workflows/aot-apply-environments.yaml scripts/aot-env-*.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve captured for-await environments across AOT suspension'
          git push origin HEAD:refs/heads/codex/aot-for-await-captured-environments
