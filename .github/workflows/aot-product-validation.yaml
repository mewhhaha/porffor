name: AOT product artifact validation

on:
  pull_request:
    paths:
      - '.github/actions/rust-verification/**'
      - 'crates/scriptw-aot-wasm/**'
      - 'crates/scriptw-front/**'
      - 'crates/scriptw-ir/**'
      - 'crates/scriptw-runtime/**'
      - 'crates/scriptw-intl/**'
      - 'crates/scriptw-engine/**'
      - 'crates/scriptw-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.github/workflows/aot-product-validation.yaml'
  push:
    branches: [main]
    paths:
      - '.github/actions/rust-verification/**'
      - 'crates/scriptw-aot-wasm/**'
      - 'crates/scriptw-front/**'
      - 'crates/scriptw-ir/**'
      - 'crates/scriptw-runtime/**'
      - 'crates/scriptw-intl/**'
      - 'crates/scriptw-engine/**'
      - 'crates/scriptw-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.github/workflows/aot-product-validation.yaml'

permissions:
  contents: read

concurrency:
  group: aot-product-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-verification
        with:
          shared-key: aot-product-validation
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify positive and negative controls are present
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p scriptw-aot-wasm --test emission -- product_artifact:: --list | tee /tmp/artifact-tests.txt
          grep -Fxq 'product_artifact::validator_rejects_a_parseable_function_result_type_mismatch: test' /tmp/artifact-tests.txt
          grep -Fxq 'product_artifact::representative_language_families_produce_valid_aot_artifacts: test' /tmp/artifact-tests.txt
          cargo test --locked -p scriptw-cli --test product_artifact_execution -- --list | tee /tmp/execution-tests.txt
          grep -Fxq 'representative_artifacts_execute_with_the_expected_transcripts: test' /tmp/execution-tests.txt
          grep -Fxq 'execution_gate_rejects_wrong_results_extra_output_and_oracle_fallback: test' /tmp/execution-tests.txt
      - name: Validate emitted product artifacts
        run: "cargo test --locked -p scriptw-aot-wasm --test emission -- product_artifact::"
      - name: Execute the shared fixtures through the real Wasm-AOT CLI
        run: cargo test --locked -p scriptw-cli --test product_artifact_execution -- --test-threads=1
