name: Prioritize final review checks

# One-shot operational cleanup, never PR validation. The prior main tree was
# already tested by PR 36; every final PR check remains enabled and untouched.
on:
  push:
    branches: [review/stack-preparation-20260907]
    paths: [.github/workflows/review-prioritize-final-checks.yaml]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  prioritize:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require prior success and cancel only duplicate push-event work
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const main = '270cbad0b4dcaa9ba21fa7425cdcd71b1fda5be6';
            const tested = 'abd2db0cec74057153f0d47d482354beccedcbb4';
            if (repo.owner !== 'mewhhaha' || repo.repo !== 'porffor' ||
                context.ref !== 'refs/heads/review/stack-preparation-20260907') {
              throw new Error('Unexpected operational context');
            }
            const branch = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (branch.object.sha !== main) throw new Error('Main moved; stop and re-evaluate');
            const pr36 = (await github.rest.pulls.get({...repo, pull_number: 36})).data;
            if (!pr36.merged || pr36.head.sha !== tested || pr36.merge_commit_sha !== main) {
              throw new Error('Prior merged-product identity changed');
            }
            const mainCommit = (await github.rest.git.getCommit({...repo, commit_sha: main})).data;
            const testedCommit = (await github.rest.git.getCommit({...repo, commit_sha: tested})).data;
            if (mainCommit.tree.sha !== testedCommit.tree.sha) {
              throw new Error('Main differs from the already-tested product tree');
            }
            const priorChecks = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {...repo, head_sha: tested, event: 'pull_request', per_page: 100});
            if (priorChecks.length !== 10 || priorChecks.some(run =>
                run.head_sha !== tested || run.event !== 'pull_request' ||
                run.status !== 'completed' || run.conclusion !== 'success')) {
              throw new Error('All ten prior-product PR workflows must have actually passed');
            }
            const protectedHeads = new Map([
              [37, 'c3bfad3cde35f765d1370291821ffa595efac048'],
              [38, '777ab51ed512901ba9d995a59c8c3a75f2084cb9'],
              [39, '2c5f4bae5b1e78bf53994389d0a1cad43e00235f'],
              [40, 'be39c0aa0865c2d434a93bf30d86097004573038'],
            ]);
            for (const [number, sha] of protectedHeads) {
              const pr = (await github.rest.pulls.get({...repo, pull_number: number})).data;
              if (pr.state !== 'open' || pr.head.sha !== sha) {
                throw new Error(`Final PR ${number} moved; stop and re-evaluate`);
              }
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {...repo, head_sha: main, event: 'push', per_page: 100});
            const outcomes = [];
            for (const run of runs) {
              if (run.head_sha !== main || run.head_branch !== 'main' || run.event !== 'push' ||
                  [...protectedHeads.values()].includes(run.head_sha) || run.id === context.runId) {
                throw new Error(`Unexpected run identity ${run.id}`);
              }
              if (run.status === 'completed') continue;
              const latest = (await github.rest.actions.getWorkflowRun({...repo, run_id: run.id})).data;
              if (latest.head_sha !== main || latest.head_branch !== 'main' || latest.event !== 'push') {
                throw new Error(`Run identity changed ${run.id}`);
              }
              if (latest.status === 'completed') continue;
              try {
                await github.rest.actions.cancelWorkflowRun({...repo, run_id: run.id});
                outcomes.push({run_id: run.id, workflow: run.name, outcome: 'duplicate push run cancelled'});
              } catch (error) {
                if (error.status !== 409) throw error;
                outcomes.push({run_id: run.id, workflow: run.name, outcome: 'already finishing'});
              }
            }
            core.info(JSON.stringify(outcomes, null, 2));
            await core.summary.addHeading('Duplicate earlier-main work only')
              .addRaw(`Main ${main} has the exact tree verified by all ten successful PR 36 workflows.\n`)
              .addRaw('Current PR heads, their checks, and all completed results are untouched. This cleanup is not validation evidence.\n')
              .addCodeBlock(JSON.stringify(outcomes, null, 2), 'json').write();
