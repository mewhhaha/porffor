name: Apply captured for-await environment batch

on:
  push:
    branches:
      - codex/aot-for-await-iteration-environments

permissions:
  contents: write

concurrency:
  group: aot-for-await-env-publisher
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/aot_apply_for_await_env.py
          python3 scripts/aot_apply_for_await_env_followup.py

      - name: Check formatting and compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo check --locked -p lila-aot-wasm

      - name: Execute focused for-await regressions through Wasmtime
        timeout-minutes: 15
        run: cargo test --locked -p lila-engine --test aot_async_for_of -- --test-threads=1

      - name: Publish verified source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/aot-apply-for-await-env.yaml
          rm scripts/aot_apply_for_await_env.py
          rm scripts/aot_apply_for_await_env_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve captured for-await iteration environments across yield"
          git push origin HEAD:codex/aot-for-await-iteration-environments
