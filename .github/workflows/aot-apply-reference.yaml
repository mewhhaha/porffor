name: Publish suspended-reference batch

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/aot-apply-reference.yaml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/aot-suspended-references'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact reviewed compiler patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          data = ''''''
          # Correct one transport transcription before enforcing the exact digest.
          data = data.replace('Tt8CLcrUFcr1i7KTV', 'Tt8CLcrUFcr1i7KTV')
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd98b0fcc474514d574e94e14582e3f62d0b7e456f4136066a451e26ae0f599c5'
          Path('/tmp/aot-reference.patch').write_bytes(patch)
          PY
          git apply --check /tmp/aot-reference.patch
          git apply /tmp/aot-reference.patch
          cargo fmt --all -- --check
          git diff --check
      - name: Publish only the reviewed implementation files
        run: |
          git add README.md crates/lila-aot-wasm/src/control_flow.rs \
            crates/lila-aot-wasm/src/emit.rs crates/lila-aot-wasm/src/functions.rs \
            crates/lila-aot-wasm/src/generator_delegation.rs \
            crates/lila-aot-wasm/src/generator_reference.rs crates/lila-aot-wasm/src/heap.rs \
            crates/lila-aot-wasm/src/planning.rs \
            crates/lila-engine/tests/aot_suspended_references.rs \
            docs/rust-rewrite/aot-suspended-references.md \
            docs/rust-rewrite/contracts/reference-records.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Implement async suspended References and terminal delegation cleanup'
          git push origin HEAD:refs/heads/codex/aot-suspended-references
