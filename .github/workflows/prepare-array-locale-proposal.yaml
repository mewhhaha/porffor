          encoded = ''.join(encoded.split()).replace('QK1NgPRLBRLZGDmx', 'QK1NgPRBRLZGDmx')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          expected_digest = '1f4ae6e80d3348567f47a780f9745bdb35ccf072e06ffd670490d820f2912c8e'
          if hashlib.sha256(patch).hexdigest() != expected_digest:
              raise SystemExit('Patch checksum mismatch')
          base = 'abdcf56f1bd88d5debbb1d8c291f2e7213f77371'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != base or git('status', '--porcelain'):
              raise SystemExit('Unexpected or dirty checkout')
          old_blobs = {
              'crates/lila-aot-wasm/src/builtins/array.rs': '135c3568acdf5a4f5d9da69b0489eb6860e7ec44',
              'README.md': '46cf3179976a9321e619d9e6baa215b79ad54e7e',
