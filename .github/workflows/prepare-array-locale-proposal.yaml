              'crates/lila-aot-wasm/tests/array_to_locale_string_observable_structure.rs',
              'crates/lila-engine/tests/aot_array_to_locale_string_observable.rs',
              'docs/rust-rewrite/aot-array-to-locale-string.md',
          ]
          for name, sha in old_blobs.items():
              if git('hash-object', '--', name) != sha:
                  raise SystemExit('Unexpected base blob: ' + name)
          for name in new_paths:
              if Path(name).exists():
                  raise SystemExit('Refusing to replace existing path: ' + name)
          patch_file = Path('/tmp/locale-proposal.patch')
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', str(patch_file)], check=True)
          paths = sorted([*old_blobs, *new_paths])
          subprocess.run(['git', 'add', '-N', '--', *paths], check=True)
          if sorted(git('diff', '--name-only').splitlines()) != paths:
              raise SystemExit('Unexpected changed file inventory')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          files = []
          for name in paths:
              path = Path(name)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('Unexpected file kind: ' + name)
              data = path.read_bytes()
              expected_sha = git('hash-object', '--', name)
              body = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/mewhhaha/porffor/git/blobs',
                  data=body, method='POST', headers={
