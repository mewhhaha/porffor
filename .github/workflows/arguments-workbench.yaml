name: Arguments regression workbench

on:
  push:
    branches: [codex/arguments-iteration-workbench]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify Arguments regression and task owners
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          find . -name AGENTS.md -not -path './.git/*'
          rg -n -i 'arguments.{0,80}iterat|iterat.{0,80}arguments' crates/lila-engine crates/lila-aot-wasm tasks docs/rust-rewrite | head -200 || true
          find tasks -maxdepth 1 -type f | sort
      - name: Package source without repository credentials
        run: tar --exclude='./.git' -czf "$RUNNER_TEMP/arguments-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: arguments-source-snapshot
          path: ${{ runner.temp }}/arguments-source.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
