name: Arguments regression workbench

on:
  push:
    branches: [codex/arguments-iteration-workbench]
    paths: [.github/workflows/arguments-workbench.yaml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 2
      LILA_TEST262_FORCE_CASE_RUNNER: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-arguments-for-of
      - name: Keep the Arguments lookup in a focused module
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4b7be2e759af35519f2caac02ae130cf81f7643c
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/lila-aot-wasm/src/control_flow.rs')
          s = p.read_text()
          start = s.index('    fn emit_arguments_iterator_method_to_locals(')
          end = s.index('    #[allow(clippy::too_many_arguments)]\n    pub(crate) fn emit_get_iterator_from_value_locals(', start)
          helper = s[start:end].rstrip().replace('    fn emit_arguments_iterator_method_to_locals(', '    pub(super) fn emit_arguments_iterator_method_to_locals(', 1)
          Path('crates/lila-aot-wasm/src/control_flow/arguments_iterator.rs').write_text("//! Shared Arguments exotic lookup used by synchronous iterator consumers.\nuse super::*;\n\nimpl FunctionBuilder<'_> {\n" + helper + '\n}\n')
          s = (s[:start] + s[end:]).replace('mod async_function_for_of_iterator;', 'mod arguments_iterator;\nmod async_function_for_of_iterator;', 1)
          p.write_text(s)
          p = Path('crates/lila-aot-wasm/tests/sync_iterator_locals_release_ownership_structure.rs')
          s = p.read_text()
          old = '"    fn emit_arguments_iterator_method_to_locals(",'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '"    pub(crate) fn emit_get_iterator_from_value_locals(",'))
          p = Path('.github/workflows/arguments-iteration.yaml')
          s = p.read_text().replace('          cargo fmt --all -- --check\n', '          cargo fmt --all -- --check\n          ./scripts/check-module-boundaries.sh\n')
          s = s.replace("          grep -Fx 'total: 6' /tmp/arguments-evidence/test262.txt\n", "          grep -Fx 'total: 6' /tmp/arguments-evidence/test262.txt\n          grep -Fx 'passed: 6' /tmp/arguments-evidence/test262.txt\n          grep -Fx 'failed: 0' /tmp/arguments-evidence/test262.txt\n")
          p.write_text(s)
          PY
          cargo fmt --all -- --check
          ./scripts/check-module-boundaries.sh
          git diff --check
          git add crates/lila-aot-wasm/src/control_flow.rs crates/lila-aot-wasm/src/control_flow/arguments_iterator.rs crates/lila-aot-wasm/tests/sync_iterator_locals_release_ownership_structure.rs .github/workflows/arguments-iteration.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(iterators): isolate shared Arguments lookup within module budget'
          git push origin HEAD:refs/heads/codex/fix-arguments-for-of
          mkdir -p /tmp/arguments-evidence
          git rev-parse HEAD | tee /tmp/arguments-evidence/source-sha.txt
          rustc --version --verbose > /tmp/arguments-evidence/rustc.txt
      - name: Protect adjacent iterator ownership and realm behavior
        run: >-
          cargo test --locked -p lila-aot-wasm
          --test for_of_string_iterator_protocol_structure
          --test direct_sync_for_of_protocol_error_realm_structure
          --test plain_async_for_of_await_using_structure
          --test synchronous_using_for_of_structure
          --test sync_iterator_locals_release_ownership_structure
          --test sync_iterator_consumer_capability_structure
          --test math_sum_precise_runtime_structure
      - name: Execute complete Arguments engine regression inventory
        run: >-
          python3 scripts/run_engine_regression_inventory.py aot_arguments_iteration
          --output-dir /tmp/arguments-evidence/engine
      - name: Execute complete pinned real Arguments for-of family
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p lila-cli
          sha256sum target/debug/lila | tee /tmp/arguments-evidence/cli-sha256.txt
          ./target/debug/lila test262 list language/statements/for-of/arguments- | tee /tmp/arguments-evidence/test262-inventory.txt
          grep -Fx 'count: 6' /tmp/arguments-evidence/test262-inventory.txt
          ./target/debug/lila test262 run language/statements/for-of/arguments- --execution-backend wasm --threads 1 --jobs 1 --timeout-ms 60000 --snapshot-dir /tmp/arguments-evidence/test262 --snapshot-name arguments-review 2>&1 | tee /tmp/arguments-evidence/test262.txt
          grep -Fx 'passed: 6' /tmp/arguments-evidence/test262.txt
      - name: Package reviewed executable
        if: ${{ !cancelled() }}
        run: |
          if test -f target/debug/lila; then
            tar -czf /tmp/arguments-review-cli.tar.gz -C target/debug lila
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arguments-review-evidence
          path: /tmp/arguments-evidence
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arguments-reviewed-cli
          path: /tmp/arguments-review-cli.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
