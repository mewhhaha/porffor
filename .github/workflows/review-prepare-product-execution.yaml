name: Prepare product execution review branch

on:
  push:
    branches: [review/04-product-execution]
    paths: [.github/workflows/review-prepare-product-execution.yaml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/04-product-execution
      - name: Bind artifact validation to the shared program inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('crates/lila-aot-wasm/tests/product_artifact.rs')
          raw = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if blob != 'd344464fe03de881c4799411e3be8b904eecdab9':
              raise SystemExit(f'Artifact fixture owner changed unexpectedly: {blob}')
          text = raw.decode('utf-8')
          import_line = 'use wasmparser::{Operator, Parser, Payload, TypeRef, Validator, WasmFeatures};\n'
          assert text.count(import_line) == 1
          text = text.replace(import_line, import_line + '\n#[path = "fixtures/product_programs.rs"]\nmod product_programs;\n')
          start = text.index('#[test]\nfn representative_language_families_produce_valid_aot_artifacts() {')
          end = text.index('#[test]\nfn validator_rejects_a_parseable_function_result_type_mismatch()', start)
          replacement = '''#[test]
          fn representative_language_families_produce_valid_aot_artifacts() {
              assert!(!product_programs::CASES.is_empty());
              for fixture in product_programs::CASES {
                  assert!(
                      !fixture.expected_stdout.is_empty(),
                      "{}: a product fixture must declare its execution expectation",
                      fixture.name
                  );
                  let bytes = emit_program(fixture.name, fixture.source.to_owned());
                  assert_product_artifact(fixture.name, &bytes, None);
              }
          }

          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          heading = '\n## Product artifact execution checks\n'
          if heading in text:
              raise SystemExit('Product execution documentation already exists; review before editing')
          text += heading + '\n`cargo test --locked -p lila-aot-wasm --test product_artifact` validates emitted Wasm and checks the evaluator boundary. `cargo test --locked -p lila-cli --test product_artifact_execution -- --test-threads=1` executes the same shared program inventory through the real product CLI, requires exact program output and the Wasm-AOT completion record, and bounds each child process. Its negative controls reject wrong results, extra output, unsuccessful processes, missing completion records and oracle fallback. These focused regressions are not a complete Test262 baseline or a conformance percentage.\n'
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Format the complete change and compile the standalone transcript controls
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          CARGO_BIN_EXE_lila=unused-for-transcript-controls rustc --edition=2021 --test crates/lila-cli/tests/product_artifact_execution.rs -o /tmp/product-execution-controls
          /tmp/product-execution-controls --exact execution_gate_rejects_wrong_results_extra_output_and_oracle_fallback
      - name: Commit preparation only to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git add --update
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: share product artifact programs with exact CLI execution checks'
          git push origin HEAD:refs/heads/review/04-product-execution
