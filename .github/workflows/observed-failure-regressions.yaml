name: Observed Test262 failure regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: observed-failures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check exact execution replay tooling
        run: |
          python3 -m unittest discover -s scripts/tests -p test_replay_test262_executions.py -v
          python3 -m unittest discover -s scripts/tests -p test_audit_test262_replay.py -v
          python3 -m unittest discover -s scripts/tests -p test_collect_new_test262_failures.py -v

      - name: Check independent source grammar and environment ownership
        run: |
          cargo test --locked -p lila-front --test comment_line_terminators --test dynamic_function_preparation --test eval_source
          cargo test --locked -p lila-ir --test object_constructor_boxing --test prepared_dynamic_function --test prepared_script --test direct_eval_environment --test declaration_completion --test borrowed_eval_loop_heads --test forwarded_dynamic_source_call
          cargo test --locked -p lila-ir --test constructor_throw_domain --test computed_numeric_method_calls

      - name: Check suspension storage and empty constructor lowering
        run: >-
          cargo test --locked -p lila-ir
          --test async_for_of_activation --test empty_function_and_erased_eval
          --test generator_branch_lexicals
          -- --test-threads=1

      - name: Check suspended class definitions and finite eval spreads
        run: >-
          cargo test --locked -p lila-ir
          --test class_computed_name_suspension --test direct_eval_spread
          -- --test-threads=1

      - name: Execute suspended expressions and environment tail calls
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_class_computed_name_suspension --test aot_direct_eval_spread
          --test aot_generator_call_suspension --test aot_tail_call_environment
          -- --test-threads=1

      - name: Check default-export names and awaited property assignments
        run: >-
          cargo test --locked -p lila-ir
          --test module_default_export_names --test async_property_assignment
          -- --test-threads=1

      - name: Execute default-export names and awaited property assignments
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_module_default_export_names --test aot_async_property_assignment
          -- --test-threads=1

      - name: Validate async-generator loop continuation ranges
        run: >-
          cargo test --locked -p lila-aot-wasm --lib
          emit::async_generator_dispatcher_tests -- --test-threads=1

      - name: Check remainder, deletion, equality and finite eval lowering
        run: |
          cargo test --locked --no-fail-fast -p lila-ir --test number_remainder --test delete_reference --test bigint_loose_equality --test finite_indirect_eval --test indirect_eval_admission
          cargo test --locked -p lila-aot-wasm --test coercive_number_arithmetic_operation_structure --test bigint_helper_op_structure --test with_environment_compound_assignment_structure --test private_element_entry_protocol_structure --test private_environment_heap_slot_structure --test realm_record_heap_slot_structure
          cargo test --locked -p lila-test262 --lib wasm_aot_allows_dataview_sab_and_immutable_setter_slice

      - name: Execute expression semantics repairs through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_number_remainder --test aot_delete_reference
          --test aot_bigint_loose_equality --test aot_finite_indirect_eval
          --test aot_indirect_eval_admission
          --test aot_shared_array_buffer_subclass
          -- --test-threads=1

      - name: Check completed-baseline syntax and reference lowering
        run: |
          cargo test --locked -p lila-front --test nul_source
          cargo test --locked -p lila-ir --test function_names --test with_var_hoisting --test with_has_binding --test private_numeric_update
          cargo test --locked -p lila-ir --test for_in_enumeration --test module_namespace_construction --test regexp_lookbehind_anchors --test regexp_lookaround --test regexp_lookbehind_polarity --test regexp_lookbehind_polarity_structure --test regexp_case_folding
          cargo test --locked -p lila-ir --test regexp_word_boundary --test regexp_reverse_whitespace --test regexp_backreference_folding --test number_constructor_coercion
          cargo test --locked -p lila-ir --test regexp_legacy_pooled_class --test legacy_utf16_pair_structure
          cargo test --locked -p lila-intl --lib
          cargo test --locked -p lila-intl --test calendar_domain -- --test-threads=1
          cargo test --locked -p lila-ir --test float16_array --test intl_locale_getters --test temporal_instant_methods
          cargo test --locked -p lila-aot-wasm --test object_literal_home_object_structure
          cargo test --locked -p lila-aot-wasm --test arguments_index_descriptor_structure --test plain_async_function_synchronous_using_structure --test async_generator_synchronous_using_structure --test plain_async_function_await_using_structure
          cargo test --locked -p lila-aot-wasm --test runtime_import_reachability
          cargo test --locked -p lila-aot-wasm --test numeric_bitwise_emission --test created_realm_typed_array_method_publication_structure --test typed_array_witness_use_ownership_structure
          cargo test --locked -p lila-aot-wasm --test typed_array_set_witness_structure --test typed_array_with_witness_structure --test typed_array_slice_witness_structure --test typed_array_constructor_source_witness_structure --test promise_internal_function_realm_context_structure
          cargo test --locked -p lila-aot-wasm --test intl_canonical_locale_tag_invocation_structure --test intl_namespace_plan_structure --test object_read_proxy_realm_structure
          cargo test --locked -p lila-aot-wasm --test with_environment_identifier_call_structure --test regexp_modifier_override_structure --test temporal_plain_date_time_field_read_mode_structure --test temporal_plain_date_time_component_structure --test temporal_zoned_date_time_difference_defaults_structure --test temporal_instant_methods_structure --test temporal_instant_epoch_proof_structure --test created_realm_temporal_structure

      - name: Execute completed-baseline expression repairs through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_bigint_relational_coercion --test aot_function_names
          --test aot_function_coercion
          --test aot_with_var_hoisting --test aot_with_has_binding --test aot_nul_source
          --test aot_private_numeric_updates
          --test aot_for_in_enumeration --test aot_module_namespace
          --test aot_for_of_head_completion
          --test aot_string_constructor
          --test aot_throw_type_error_realm
          --test aot_constructor_throw_domain --test aot_runtime_import_reachability
          --test aot_computed_numeric_method_calls
          --test aot_regexp_lookbehind_anchors --test aot_regexp_lookaround --test aot_temporal_buddhist_calendar
          --test aot_regexp_backreference --test aot_regexp_backreference_folding --test aot_regexp_case_folding
          --test aot_regexp_word_boundary --test aot_regexp_reverse_whitespace --test aot_regexp_forward_whitespace
          --test aot_regexp_legacy_pooled_class
          --test aot_numeric_bitwise --test aot_typed_array_fill
          --test aot_float16_array --test aot_typed_array_byte_copy
          --test aot_intl_locale_options --test aot_intl_locale_constructor
          --test aot_temporal_zoned_with
          -- --test-threads=1

      - name: Preserve pinned Test262 harness semantics
        run: cargo test --locked -p lila-test262 --test wasm_aot_pinned_harness -- --test-threads=1

      - name: Execute repaired compiler paths through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_arguments_concat --test aot_async_loop_bindings
          --test aot_arguments_index_descriptors
          --test aot_async_for_of_continuations --test aot_async_resource_loops
          --test aot_await_rejection_realm --test aot_empty_function
          --test aot_empty_dynamic_functions --test aot_dynamic_source_capability
          --test aot_created_realm_dynamic_functions
          --test aot_async_disposable_stack_realm
          --test aot_created_realm_async_disposable_stack
          --test aot_thrown_exception_constructor
          --test aot_for_await_rejection_close --test aot_generator_loops
          --test aot_regexp_recompile -- --test-threads=1

      - name: Keep runtime capability failures distinct from JavaScript errors
        run: >-
          cargo test --locked -p lila-test262 --lib
          runtime_dynamic_source_cannot_pass_by_catching_or_matching_a_js_error
          -- --test-threads=1

      - name: Execute later failures and prepared source environments through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_bound_function_metadata --test aot_created_realm_disposable_stack
          --test aot_created_realm_array_iterator
          --test aot_function_apply_resizable --test aot_function_caller
          --test aot_iterator_consumers --test aot_prepared_dynamic_function
          --test aot_prepared_script --test aot_prepared_global_declarations
          --test aot_declaration_completion
          --test aot_execution_global_environment --test aot_direct_eval
          --test aot_direct_eval_call_identity --test aot_direct_eval_environment
          --test aot_direct_eval_escaped_arrows --test aot_resumable_global_assignment
          --test aot_parameter_environment_lifetime
          --test aot_has_property_helper
          --test aot_aggregate_error_constructor_realm
          --test aot_suppressed_error_constructor_realm
          --test aot_string_numeric_prefixes --test aot_proto_getter_receiver
          --test aot_temporal_month_code --test aot_typed_array_reference_get --test aot_bigint_numeric_updates
          --test aot_bigint_number_conversion --test aot_buffer_backing_store
          --test aot_regexp_constructor_and_iterator
          --test aot_promise_combinator_intrinsics
          -- --test-threads=2

      - name: Execute Temporal baseline repairs through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_temporal_plain_year_month
          --test aot_temporal_zoned_date_time_format
          --test aot_temporal_zoned_date_time_surface
          --test aot_temporal_zoned_date_time_day
          --test aot_temporal_zoned_date_time_round
          --test aot_temporal_zoned_date_time_difference --test aot_temporal_instant_methods
          --test aot_temporal_duration_wide_fields
          --test aot_temporal_plain_date_zoned
          -- --test-threads=1

      - name: Check canonical Duration Number fields
        run: >-
          cargo test --locked -p lila-aot-wasm
          --test temporal_duration_number_fields_structure
          --test temporal_duration_field_transform_structure
          --test temporal_duration_arithmetic_operation_structure
          --test temporal_duration_heap_slot_structure

      - name: Check Uint8Array codec lowering contracts
        run: |
          cargo test --locked -p lila-ir --lib uint8_array_codec
          cargo test --locked -p lila-ir --lib catalog_contract_tests::

      - name: Execute Uint8Array codec regressions through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_uint8array_hex
          --test aot_uint8array_base64_decode
          --test aot_uint8array_base64_encode
          -- --test-threads=1

      - name: Check Temporal option and getter ownership
        run: >-
          cargo test --locked -p lila-aot-wasm
          --test temporal_unit_option_property_domain_structure
          --test temporal_zoned_date_time_field_result_structure
          -- --test-threads=1

      - name: Preserve every root and worker failure
        run: |
          cargo test --locked -p lila-engine --lib execution_failure:: -- --test-threads=1
          cargo test --locked -p lila-engine --lib agent_failure_tests:: -- --test-threads=1
          cargo test --locked -p lila-test262 --lib agent_failures_never_satisfy_expected_root_runtime_exceptions -- --test-threads=1
          cargo test --locked -p lila-test262 --lib typed_root_runtime_exception_still_satisfies_negative_expectations -- --test-threads=1
          cargo test --locked -p lila-test262 --lib typed_runtime_negative_ignores_error_names_in_messages_and_primitives -- --test-threads=1
          cargo test --locked -p lila-test262 --lib wasm_aot_retains_async_done_failures_alongside_execution_failures -- --test-threads=1
          cargo test --locked -p lila-test262 --lib wasm_aot_enforces_async_done_output_after_jobs_drain -- --test-threads=1

      - name: Check created-realm disposal ownership
        run: cargo test --locked -p lila-aot-wasm --test created_realm_async_disposable_stack_structure
