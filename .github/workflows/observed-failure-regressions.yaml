name: Observed Test262 failure regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: observed-failures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One sequential job exceeded its 90-minute limit before its later steps
  # ran. Independent jobs keep every step and fit the limit; each builds its
  # own targets and shares a dependency cache.
  lowering:
    name: Lowering, structure and harness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: observed-failure-regressions

      - name: Check exact execution replay tooling
        run: |
          python3 -m unittest discover -s scripts/tests -p test_replay_test262_executions.py -v
          python3 -m unittest discover -s scripts/tests -p test_audit_test262_replay.py -v
          python3 -m unittest discover -s scripts/tests -p test_collect_new_test262_failures.py -v

      - name: Check independent source grammar and environment ownership
        run: |
          cargo test --locked -p lila-front --test comment_line_terminators --test dynamic_function_preparation --test eval_source
          cargo test --locked -p lila-ir --test object_constructor_boxing --test prepared_dynamic_function --test prepared_script --test direct_eval_environment --test declaration_completion --test borrowed_eval_loop_heads --test forwarded_dynamic_source_call
          cargo test --locked -p lila-ir --test constructor_throw_domain --test computed_numeric_method_calls

      - name: Check suspension storage and empty constructor lowering
        run: >-
          cargo test --locked -p lila-ir
          --test async_for_of_activation --test empty_function_and_erased_eval
          --test generator_branch_lexicals
          -- --test-threads=1

      - name: Check suspended class definitions and finite eval spreads
        run: >-
          cargo test --locked -p lila-ir
          --test class_computed_name_suspension --test direct_eval_spread
          -- --test-threads=1

      - name: Check default-export names and awaited property assignments
        run: >-
          cargo test --locked -p lila-ir
          --test module_default_export_names --test async_property_assignment
          -- --test-threads=1

      - name: Validate async-generator loop continuation ranges
        run: >-
          cargo test --locked -p lila-aot-wasm --lib
          emit::async_generator_dispatcher_tests -- --test-threads=1

      - name: Check all current AOT compiler library and test targets
        run: >-
          cargo test --locked -p lila-aot-wasm --lib --tests
          -- --test-threads=1

      - name: Execute current numeric, Temporal and disposal GC controls
        run: >-
          cargo test --locked -p lila-engine
          --test aot_gc_entries --test aot_realm_modules
          -- aot_gc_numeric_values:: aot_gc_temporal_entries::
          aot_created_realm_async_disposable_stack:: --test-threads=1

      - name: Check remainder, deletion, equality and finite eval lowering
        run: |
          cargo test --locked --no-fail-fast -p lila-ir --test number_remainder --test delete_reference --test bigint_loose_equality --test finite_indirect_eval --test indirect_eval_admission
          cargo test --locked -p lila-test262 --lib wasm_aot_allows_dataview_sab_and_immutable_setter_slice

      - name: Check completed-baseline syntax and reference lowering
        run: |
          cargo test --locked -p lila-front --test nul_source
          cargo test --locked -p lila-ir --test function_names --test with_var_hoisting --test with_has_binding --test private_numeric_update
          cargo test --locked -p lila-ir --test for_in_enumeration --test module_namespace_construction --test regexp_lookbehind_anchors --test regexp_lookaround --test regexp_lookbehind_polarity --test regexp_lookbehind_polarity_structure --test regexp_case_folding
          cargo test --locked -p lila-ir --test regexp_word_boundary --test regexp_reverse_whitespace --test regexp_backreference_folding --test number_constructor_coercion
          cargo test --locked -p lila-ir --test regexp_legacy_pooled_class --test legacy_utf16_pair_structure
          cargo test --locked -p lila-intl --lib
          cargo test --locked -p lila-intl --test calendar_domain -- --test-threads=1
          cargo test --locked -p lila-ir --test float16_array --test intl_locale_getters --test temporal_instant_methods

      - name: Check Uint8Array codec lowering contracts
        run: |
          cargo test --locked -p lila-ir --lib uint8_array_codec
          cargo test --locked -p lila-ir --lib catalog_contract_tests::


      - name: Keep runtime capability failures distinct from JavaScript errors
        run: >-
          cargo test --locked -p lila-test262 --lib
          runtime_dynamic_source_cannot_pass_by_catching_or_matching_a_js_error
          -- --test-threads=1

      - name: Preserve pinned Test262 harness semantics
        run: cargo test --locked -p lila-test262 --test wasm_aot_pinned_harness -- --test-threads=1

      - name: Preserve every root and worker failure
        run: |
          cargo test --locked -p lila-engine --lib execution_failure:: -- --test-threads=1
          cargo test --locked -p lila-engine --lib agent_failure_tests:: -- --test-threads=1
          cargo test --locked -p lila-test262 --lib agent_failures_never_satisfy_expected_root_runtime_exceptions -- --test-threads=1
          cargo test --locked -p lila-test262 --lib typed_root_runtime_exception_still_satisfies_negative_expectations -- --test-threads=1
          cargo test --locked -p lila-test262 --lib typed_runtime_negative_ignores_error_names_in_messages_and_primitives -- --test-threads=1
          cargo test --locked -p lila-test262 --lib wasm_aot_retains_async_done_failures_alongside_execution_failures -- --test-threads=1
          cargo test --locked -p lila-test262 --lib wasm_aot_enforces_async_done_output_after_jobs_drain -- --test-threads=1

      - name: Preserve CLI numeric completion policies
        run: >-
          cargo test --locked -p lila-cli --test cli
          language_numerics::run_wasm_backend_keeps_bigint_prototype_result_policies_distinct
          -- --exact

  suspension:
    name: Suspension and expression semantics through Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: observed-failure-regressions

      - name: Execute suspended expressions and environment tail calls
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_generators --test aot_realm_modules --test aot_language
          -- aot_class_computed_name_suspension:: aot_direct_eval_spread::
          aot_generator_call_suspension:: aot_tail_call_environment:: --test-threads=1

      - name: Execute default-export names and awaited property assignments
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_realm_modules --test aot_async
          -- aot_module_default_export_names:: aot_async_property_assignment::
          --test-threads=1

      - name: Execute expression semantics repairs through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_builtins --test aot_language --test aot_realm_modules
          -- aot_number_remainder:: aot_delete_reference:: aot_bigint_loose_equality::
          aot_finite_indirect_eval:: aot_indirect_eval_admission::
          aot_shared_array_buffer_subclass:: --test-threads=1

  completed-baseline-1:
    name: Completed-baseline repairs through Wasmtime (1/2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: observed-failure-regressions

      - name: Execute completed-baseline expression repairs through Wasmtime (1/2)
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_builtins --test aot_language --test aot_realm_modules --test aot_regexp
          -- aot_bigint_relational_coercion:: aot_function_names:: aot_function_coercion::
          aot_with_var_hoisting:: aot_with_has_binding:: aot_nul_source::
          aot_private_numeric_updates:: aot_for_in_enumeration:: aot_module_namespace::
          aot_for_of_head_completion:: aot_string_constructor:: aot_throw_type_error_realm::
          aot_constructor_throw_domain:: aot_runtime_import_reachability::
          aot_computed_numeric_method_calls:: aot_regexp_lookbehind_anchors::
          --test-threads=1

  completed-baseline-2:
    name: Completed-baseline repairs through Wasmtime (2/2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: observed-failure-regressions

      - name: Execute completed-baseline expression repairs through Wasmtime (2/2)
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_regexp --test aot_temporal --test aot_builtins --test aot_intl
          -- aot_regexp_lookaround:: aot_temporal_buddhist_calendar::
          aot_regexp_backreference:: aot_regexp_backreference_folding::
          aot_regexp_case_folding:: aot_regexp_word_boundary::
          aot_regexp_reverse_whitespace:: aot_regexp_forward_whitespace::
          aot_regexp_legacy_pooled_class:: aot_numeric_bitwise:: aot_typed_array_fill::
          aot_float16_array:: aot_typed_array_byte_copy:: aot_intl_locale_options::
          aot_intl_locale_constructor:: aot_temporal_zoned_with:: --test-threads=1

  repaired-paths:
    name: Repaired compiler paths and codecs through Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: observed-failure-regressions

      - name: Execute repaired compiler paths through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_language --test aot_async --test aot_realm_modules --test aot_generators --test aot_regexp
          -- aot_arguments_concat:: aot_async_loop_bindings::
          aot_arguments_index_descriptors:: aot_async_for_of_continuations::
          aot_async_resource_loops:: aot_await_rejection_realm:: aot_empty_function::
          aot_empty_dynamic_functions:: aot_dynamic_source_capability::
          aot_created_realm_dynamic_functions:: aot_async_disposable_stack_realm::
          aot_created_realm_async_disposable_stack:: aot_thrown_exception_constructor::
          aot_for_await_rejection_close:: aot_generator_loops:: aot_regexp_recompile::
          --test-threads=1

      - name: Execute Uint8Array codec regressions through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_builtins
          -- aot_uint8array_hex:: aot_uint8array_base64_decode::
          aot_uint8array_base64_encode:: --test-threads=1

  later-failures:
    name: Later failures and prepared sources through Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: observed-failure-regressions

      - name: Execute later failures and prepared source environments through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_builtins --test aot_realm_modules --test aot_language --test aot_generators --test aot_temporal --test aot_regexp
          -- aot_bound_function_metadata:: aot_created_realm_disposable_stack::
          aot_created_realm_array_iterator:: aot_function_apply_resizable::
          aot_function_caller:: aot_iterator_consumers:: aot_prepared_dynamic_function::
          aot_prepared_script:: aot_prepared_global_declarations::
          aot_declaration_completion:: aot_execution_global_environment:: aot_direct_eval::
          aot_direct_eval_call_identity:: aot_direct_eval_environment::
          aot_direct_eval_escaped_arrows:: aot_resumable_global_assignment::
          aot_parameter_environment_lifetime:: aot_has_property_helper::
          aot_aggregate_error_constructor_realm:: aot_suppressed_error_constructor_realm::
          aot_string_numeric_prefixes:: aot_proto_getter_receiver::
          aot_temporal_month_code:: aot_typed_array_reference_get::
          aot_bigint_numeric_updates:: aot_bigint_number_conversion::
          aot_buffer_backing_store:: aot_regexp_constructor_and_iterator::
          aot_promise_combinator_intrinsics:: --test-threads=2

  temporal:
    name: Temporal baseline repairs through Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: observed-failure-regressions

      - name: Execute Temporal baseline repairs through Wasmtime
        run: >-
          cargo test --locked --no-fail-fast -p lila-engine
          --test aot_temporal
          -- aot_temporal_plain_year_month:: aot_temporal_zoned_date_time_format::
          aot_temporal_zoned_date_time_surface:: aot_temporal_zoned_date_time_day::
          aot_temporal_zoned_date_time_round:: aot_temporal_zoned_date_time_difference::
          aot_temporal_instant_methods:: aot_temporal_duration_wide_fields::
          aot_temporal_plain_date_zoned:: --test-threads=1
