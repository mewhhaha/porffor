name: Finalize portability document preservation

on:
  push:
    branches: [review/02-repository-portability]
    paths: [.github/workflows/review-finalize-portability.yaml]

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/02-repository-portability
          fetch-depth: 0
      - name: Preserve the original pointer and update only its two references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('docs/rust-rewrite/contracts/early-error-taxonomy.md')
          old = 'Early-error taxonomy: one closed EarlyErrorCode domain and one fragment table, not two that have already drifted.md'
          new = 'early-error-closed-domain-proposal.md'
          original = subprocess.check_output(['git', 'show', '72b6516c9f9f5a74a8fd2c26ad5baa8409b55a6d:' + path.as_posix()])
          text = original.decode('utf-8')
          assert text.count(old) == 2
          assert path.read_bytes() == original, 'Refusing to replace an unexpectedly changed pointer'
          path.write_text(text.replace(old, new), encoding='utf-8')
          proposal = path.with_name(new)
          source = subprocess.check_output(['git', 'show', '72b6516c9f9f5a74a8fd2c26ad5baa8409b55a6d:' + path.with_name(old).as_posix()])
          assert proposal.read_bytes() == source, 'Full proposal must be preserved byte-for-byte'
          assert len(path.read_text().splitlines()) == len(text.splitlines())
          PY
          python3 -m unittest discover -s scripts/tests -p test_repository_paths.py -v
          python3 scripts/check-repository-paths.py
          git add docs/rust-rewrite/contracts/early-error-taxonomy.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: retain early-error amendments and point to the portable proposal'
          git push origin HEAD:refs/heads/review/02-repository-portability
