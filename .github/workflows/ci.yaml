name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository contracts
        run: |
          ./scripts/check-task-plan.sh
          ./scripts/tests/check-readme-status-artifacts.sh
          ./scripts/tests/audit-test262-shortcut-scanner.sh
          ./scripts/check-module-boundaries.sh
          ./scripts/audit-test262-shortcuts.sh --check
          ./scripts/check-test262-host-abi.sh
          ./scripts/check-no-legacy-js.sh
          ./scripts/check-lila-identity.sh

      - name: Check pinned Intl keyword alias generation
        run: |
          python3 -m unittest discover -s scripts/tests -p test_generate_intl_keyword_aliases.py -v
          python3 scripts/generate-intl-keyword-aliases.py --check

      - name: Check generated README status edits
        if: github.event_name == 'pull_request'
        run: ./scripts/check-readme-status-artifacts.sh origin/${{ github.base_ref }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo xc

      - name: Test Test262 harness loading
        run: |
          cargo test -p lila-test262 --lib -- harness
          cargo test -p lila-test262 --lib -- load_preludes

      - name: Test completed-baseline compiler and runtime regressions
        run: |
          cargo test --release --locked -p lila-front --test regexp_legacy_astral_ranges
          cargo test --release --locked -p lila-intl --lib
          cargo test --release --locked -p lila-ir --test compound_addition_flow --test compound_assignment_saved_value --test regexp_legacy_pooled_class --test intl_locale_getters --test float16_array --test catch_pattern_owners
          cargo test --release --locked -p lila-aot-wasm --lib constant_number_condition
          cargo test --release --locked -p lila-aot-wasm --test constant_number_condition_emission --test created_realm_intl_structure --test intl_bound_format_realm_structure --test intl_host_imports --test set_operation_domains_structure --test bigint_number_policy_structure --test strict_equality_static_kind_structure --test mixed_bigint_representation_equality_structure
          cargo test --release --locked -p lila-test262 --test wasm_aot_callable_harness -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_compound_addition_flow --test aot_compound_assignment_saved_value --test aot_constant_number_condition --test aot_set_algebra_copy_phases --test aot_intl_created_realm --test aot_intl_bound_format_realm --test aot_intl_keyword_aliases --test aot_intl_locale_host_import --test aot_intl_locale_constructor --test aot_intl_locale_options --test aot_float16_array --test aot_typed_array_byte_copy --test aot_typed_array_constructor_error_realm --test aot_regexp_legacy_pooled_class --test aot_number_to_bigint --test aot_bigint_number_conversion --test aot_catch_pattern_owners --test aot_equality_operand_effects --test aot_intrinsic_receiver_observation -- --test-threads=2

      - name: Execute the pinned Test262 agent regression (non-vacuous)
        shell: bash
        run: |
          set -euo pipefail
          test_name=tests::wasm_agents_run_pinned_test262_case_with_exact_host_order
          cargo test --locked -p lila-test262 --lib "$test_name" -- --exact --list | tee /tmp/agent-inventory.txt
          grep -Fxq "$test_name: test" /tmp/agent-inventory.txt
          cargo test --locked -p lila-test262 --lib "$test_name" -- --exact --nocapture | tee /tmp/agent-result.txt
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' /tmp/agent-result.txt

      - name: Audit emitted product artifact
        run: cargo test -p lila-aot-wasm --test product_artifact

      - name: Check known-failure ledger
        run: >-
          cargo test -p lila-cli --test cli -- known_failures:: --test-threads=2

      - name: Build CLI
        run: cargo build -p lila-cli

      - name: Run fake wasm-safe Test262 suite
        run: >-
          ./target/debug/lila test262 run language/wasm/pass
          --suite-root crates/lila-test262/tests/fixtures/fake_test262/vendor/test262
          --execution-backend wasm

      - name: Run full fake Test262 suite
        run: >-
          ./target/debug/lila test262 run
          --suite-root crates/lila-test262/tests/fixtures/fake_test262/vendor/test262

      - name: Audit product dependency graph
        run: ./scripts/check-no-interpreter-in-product-graph.sh

  native-release-build:
    name: Native release build (${{ matrix.artifact }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lila-linux-x86_64
            path: target/release/lila
          - os: macos-latest
            artifact: lila-macos
            path: target/release/lila
          - os: windows-latest
            artifact: lila-windows-x86_64
            path: target/release/lila.exe
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p lila-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
