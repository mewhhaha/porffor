name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository contracts
        run: |
          ./scripts/check-task-plan.sh
          ./scripts/tests/check-readme-status-artifacts.sh
          ./scripts/tests/audit-test262-shortcut-scanner.sh
          ./scripts/check-module-boundaries.sh
          ./scripts/audit-test262-shortcuts.sh --check
          ./scripts/check-test262-host-abi.sh
          ./scripts/check-no-legacy-js.sh
          ./scripts/check-lila-identity.sh

      - name: Check pinned Intl keyword alias generation
        run: |
          python3 -m unittest discover -s scripts/tests -p test_generate_intl_keyword_aliases.py -v
          python3 scripts/generate-intl-keyword-aliases.py --check

      - name: Check generated README status edits
        if: github.event_name == 'pull_request'
        run: ./scripts/check-readme-status-artifacts.sh origin/${{ github.base_ref }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo xc

      - name: Test AOT compiler library and discovered test targets
        run: cargo test --release --locked -p lila-aot-wasm --lib --tests -- --test-threads=1

      - name: Test Test262 harness loading
        run: |
          cargo test -p lila-test262 --lib -- harness
          cargo test -p lila-test262 --lib -- load_preludes

      - name: Test completed-baseline compiler and runtime regressions
        run: |
          cargo test --release --locked -p lila-front --test regexp_legacy_astral_ranges
          cargo test --release --locked -p lila-intl --lib
          cargo test --release --locked -p lila-intl --test calendar_domain -- --test-threads=1
          cargo test --release --locked -p lila-ir --test compound_addition_flow --test compound_assignment_saved_value --test regexp_legacy_pooled_class --test intl_locale_getters --test float16_array --test catch_pattern_owners
          cargo test --release --locked -p lila-test262 --test wasm_aot_callable_harness -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_compound_addition_flow --test aot_compound_assignment_saved_value --test aot_constant_number_condition --test aot_set_algebra_copy_phases --test aot_intl_created_realm --test aot_intl_bound_format_realm --test aot_intl_keyword_aliases --test aot_intl_locale_host_import --test aot_intl_locale_constructor --test aot_intl_locale_options --test aot_intl_locale_likely_subtags --test aot_float16_array --test aot_typed_array_byte_copy --test aot_typed_array_constructor_error_realm --test aot_regexp_legacy_pooled_class --test aot_number_to_bigint --test aot_bigint_number_conversion --test aot_catch_pattern_owners --test aot_equality_operand_effects --test aot_intrinsic_receiver_observation -- --test-threads=2

      - name: Test module instantiation and suspension environments
        run: |
          cargo test --release --locked -p lila-ir --lib async_for_of_body
          cargo test --release --locked -p lila-ir --test async_if_continuations --test async_for_of_continuations --test synchronous_resource_loops --test module_instantiation --test array_arguments_primitive --test module_default_export_names --test prepared_script_host_globals --test module_import_jobs --test graph_build_structure --test link_error_structure
          cargo test --release --locked -p lila-engine --lib module_prelude
          cargo test --release --locked -p lila-engine --lib module_async_runtime_tests -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_module_async_lifecycle -- --test-threads=2
          cargo test --release --locked -p lila-ir --test module_entry_completion
          cargo test --release --locked -p lila-engine --test aot_module_entry_completion --test aot_promise_rejection_policy -- --test-threads=2
          cargo test --release --locked -p lila-engine --lib execution_failure::tests -- --test-threads=2
          cargo test --release --locked -p lila-test262 --lib module_entry_completion -- --test-threads=2
          cargo test --release --locked -p lila-test262 --lib module_materialization
          cargo test --release --locked -p lila-test262 --lib module_runner
          cargo test --release --locked -p lila-engine --test aot_async_if --test aot_async_property_assignment --test aot_generator_catch_environment --test aot_module_instantiation --test aot_module_scope_isolation --test aot_public_class_fields --test aot_array_arguments_primitive --test aot_catch_pattern_owners --test aot_control_flow --test aot_prepared_script_hosts --test aot_module_import_jobs -- --test-threads=2

      - name: Test Intl date/time provider, locale methods and RegExp compilation
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/tests/test_generate_intl_datetime_profile.py scripts/tests/test_intl_cldr_profile.py
          python3 scripts/generate-intl-datetime-profile.py --output crates/lila-intl/src/provider/datetime/generated/profile.json --check
          python3 scripts/generate-intl-datetime-identity.py --check
          cargo test --release --locked -p lila-engine --lib intl_datetime_host::tests -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_intl_datetime_provider --test aot_intl_datetime_numbering --test aot_date_locale --test aot_regexp_recompile -- --test-threads=2
          cargo test --release --locked -p lila-engine --lib regexp_program_boundary_tests -- --test-threads=2
          cargo test --release --locked -p lila-engine --lib runtime_regexp_compiler_tests -- --test-threads=2
          cargo test --release --locked -p lila-engine --lib array_present_index_tests -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_array_index_storage -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_string_match_call --test aot_string_constructor -- --test-threads=2
          cargo test --release --locked -p lila-ir --test throw_type_error_realm
          cargo test --release --locked -p lila-engine --test aot_throw_type_error_realm -- --test-threads=2
          cargo test --release --locked -p lila-ir --lib regexp::program::tests

      - name: Test pinned number formatting and primitive locale methods
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/generate-intl-numberformat-profile.py --verify-sources
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/generate-intl-numberformat-profile.py --check
          cargo test --release --locked -p lila-engine --lib intl_number_host::tests -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_intl_numberformat --test aot_array_to_locale_string_observable -- --test-threads=2
          cargo test --release --locked -p lila-cli --test cli language_numerics::run_wasm_backend_keeps_bigint_prototype_result_policies_distinct -- --exact --test-threads=2

      - name: Test pinned named time-zone data and formatting
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/tests/test_generate_intl_named_time_zones.py scripts/tests/test_generate_intl_time_zone_names.py
          python3 scripts/generate-intl-named-time-zones.py --check
          python3 scripts/generate-intl-time-zone-names.py --check
          cargo test --release --locked -p lila-engine --lib intl_time_zone_host::tests -- --test-threads=2
          cargo test --release --locked -p lila-engine --test aot_intl_named_time_zones -- --test-threads=2

      - name: Test JSON reviver property definitions
        run: |
          cargo test --release --locked -p lila-engine --test aot_json_reviver_definitions -- --test-threads=2

      - name: Test property definition Realm ownership
        run: |
          cargo test --release --locked -p lila-engine --test aot_define_property_realm --test aot_legacy_accessor_definers --test reflect_descriptor_object_realm --test aot_reflect_completed_descriptors -- --test-threads=2

      - name: Test Promise host completion policy
        run: |
          cargo test --release --locked -p lila-engine --test aot_promise_rejection_policy -- --test-threads=2
          cargo test --release --locked -p lila-engine --lib program_cache_key_tracks_source_goal_and_configuration
          cargo test --release --locked -p lila-engine --lib wasm_agent_compile_policy_preserves_root_module_authority
          cargo test --release --locked -p lila-test262 --lib wasm_aot_host_tracker_preserves_sync_completion_and_async_failures -- --test-threads=2
          cargo test --release --locked -p lila-test262 --lib wasm_aot_module_evaluation_rejection_remains_a_failure -- --test-threads=2

      - name: Test Arguments indexed descriptor presence
        run: |
          cargo test --release --locked -p lila-engine --test aot_arguments_index_descriptors -- --test-threads=2

      - name: Execute the pinned Test262 agent regression (non-vacuous)
        shell: bash
        run: |
          set -euo pipefail
          test_name=tests::wasm_agents_run_pinned_test262_case_with_exact_host_order
          cargo test --locked -p lila-test262 --lib "$test_name" -- --exact --list | tee /tmp/agent-inventory.txt
          grep -Fxq "$test_name: test" /tmp/agent-inventory.txt
          cargo test --locked -p lila-test262 --lib "$test_name" -- --exact --nocapture | tee /tmp/agent-result.txt
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' /tmp/agent-result.txt

      - name: Audit emitted product artifact
        run: cargo test -p lila-aot-wasm --test product_artifact

      - name: Check known-failure ledger
        run: >-
          cargo test -p lila-cli --test cli -- known_failures:: --test-threads=2

      - name: Build CLI
        run: cargo build -p lila-cli

      - name: Run fake wasm-safe Test262 suite
        run: >-
          ./target/debug/lila test262 run language/wasm/pass
          --suite-root crates/lila-test262/tests/fixtures/fake_test262/vendor/test262
          --execution-backend wasm

      - name: Run full fake Test262 suite
        run: >-
          ./target/debug/lila test262 run
          --suite-root crates/lila-test262/tests/fixtures/fake_test262/vendor/test262

      - name: Audit product dependency graph
        run: ./scripts/check-no-interpreter-in-product-graph.sh

  pinned-conformance-closure:
    name: Gate native release on fresh full pinned conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/conformance-closure.yaml

  native-release-build:
    name: Native release build (${{ matrix.artifact }})
    needs: [validate, pinned-conformance-closure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lila-linux-x86_64
            path: target/release/lila
          - os: macos-latest
            artifact: lila-macos
            path: target/release/lila
          - os: windows-latest
            artifact: lila-windows-x86_64
            path: target/release/lila.exe
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p lila-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
