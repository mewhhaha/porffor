name: Publish captured iteration batch

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/aot-publish-iteration.yaml'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/aot-captured-iteration-environments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply the exact checked source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = 'eff0c7bba1ccecbe8d77420b502895d8f4305e705d4409f38070083c955a6bbf'
          assert hashlib.sha256(patch).hexdigest() == expected, 'patch checksum mismatch'
          Path('/tmp/iteration.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', '/tmp/iteration.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/iteration.patch'], check=True)
          allowed = {'README.md', 'crates/lila-aot-wasm/src/control_flow.rs', 'crates/lila-aot-wasm/src/control_flow/for_await_iteration_environment.rs', 'crates/lila-aot-wasm/src/emit.rs', 'crates/lila-engine/tests/aot_captured_for_await.rs', 'docs/rust-rewrite/aot-captured-for-await.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == allowed, changed
          staged = subprocess.check_output(['git', 'diff', '--cached', '--full-index', '--binary'])
          assert hashlib.sha256(staged).hexdigest() == expected, 'staged patch differs'
          PY
          cargo fmt --all -- --check
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve captured for-await head cells across suspension'
          git push origin HEAD:codex/aot-captured-iteration-environments
