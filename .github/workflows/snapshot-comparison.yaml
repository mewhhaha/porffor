name: Snapshot comparison contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record inputs and build the comparison contract target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/snapshot-comparison-evidence
          git rev-parse HEAD | tee /tmp/snapshot-comparison-evidence/source-commit.txt
          sha256sum crates/lila-test262/src/lib.rs crates/lila-test262/src/snapshot_comparison_identity_tests.rs \
            | tee /tmp/snapshot-comparison-evidence/input-sha256.txt
          cargo test --locked -p lila-test262 --lib --no-run --message-format=json \
            > /tmp/snapshot-comparison-evidence/build.jsonl
      - name: Execute the complete compiled inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import hashlib
          import subprocess
          from run_aot_unit_shard import parse_inventory, passed_exactly_one
          evidence = Path("/tmp/snapshot-comparison-evidence")
          binaries = set()
          for line in (evidence / "build.jsonl").read_text().splitlines():
              message = json.loads(line)
              if (message.get("reason") == "compiler-artifact"
                      and message["target"]["name"] == "lila_test262"
                      and message["profile"]["test"] and message.get("executable")):
                  binaries.add(message["executable"])
          if len(binaries) != 1:
              raise SystemExit(f"expected exactly one comparison test executable, found {binaries}")
          binary = Path(binaries.pop())
          inventory = subprocess.check_output([str(binary), "--list"], text=True, timeout=30)
          (evidence / "inventory.txt").write_text(inventory)
          all_names = parse_inventory(inventory)
          names = [name for name in all_names if name.startswith("snapshot_comparison_identity_tests::")]
          if len(names) != 10:
              raise SystemExit(f"expected all ten retained comparison controls, found {names}")
          results = []
          for name in names:
              result = subprocess.run([str(binary), name, "--exact", "--nocapture", "--test-threads=1"],
                                      text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
              log = hashlib.sha256(name.encode()).hexdigest() + ".txt"
              (evidence / log).write_text(result.stdout)
              passed = result.returncode == 0 and passed_exactly_one(result.stdout, len(all_names))
              results.append({"name": name, "passed": passed, "log": log})
          summary = {"total": len(results), "passed": sum(item["passed"] for item in results), "results": results}
          (evidence / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          if summary["passed"] != summary["total"]:
              raise SystemExit("comparison contract inventory failed")
          PY
      - name: Retain snapshot evidence and execution identity contracts
        run: >-
          cargo test --locked -p lila-test262
          --test snapshot_use_structure
          --test aggregate_evidence_requirement_structure
          --test execution_identity_structure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-comparison-contracts
          path: /tmp/snapshot-comparison-evidence
          if-no-files-found: error
