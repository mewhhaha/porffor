name: Prepare portability review branch

on:
  push:
    branches: [review/02-repository-portability]
    paths: [.github/workflows/review-prepare-portability.yaml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/02-repository-portability
      - name: Rename the complete nonportable document inventory and update references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from urllib.parse import quote
          renames = {
              'Early-error taxonomy: one closed EarlyErrorCode domain and one fragment table, not two that have already drifted.md': 'early-error-taxonomy.md',
              "IteratorClose as an obligation stated where the iterator is acquired: witness coverage for the four uncovered IR constructs, plus a consumer for the catalog's unread abrupt column.md": 'iterator-close-obligation-catalog.md',
              'Environment Record binding lifecycle: TDZ as a per-binding typestate on BindingInfo, replacing the parallel string-set stack and the storage-name prefix.md': 'environment-record-binding-lifecycle.md',
              'Module binding-name domains: [[LocalName]] vs [[ExportName]] vs merged storage name.md': 'module-binding-name-domains.md',
              'Reference Records: one record, a carried [[Strict]], and a write that consumes it.md': 'reference-records-single-owner-contract.md',
              'The Property Descriptor lattice: one closed 6.2.6 type and one derived ValidateAndApplyPropertyDescriptor, replacing a raw u64 bitfield re-derived at eight sites.md': 'property-descriptor-lattice.md',
          }
          contracts = Path('docs/rust-rewrite/contracts')
          for old, new in renames.items():
              source, destination = contracts / old, contracts / new
              if source.exists():
                  if destination.exists():
                      raise SystemExit(f'Refusing to overwrite {destination}')
                  subprocess.run(['git', 'mv', '--', str(source), str(destination)], check=True)
              elif not destination.exists():
                  raise SystemExit(f'Missing both sides of rename: {old}')
          pairs = []
          for old, new in renames.items():
              pairs.extend([(old, new), (quote(old), quote(new)), (quote(old, safe=':'), quote(new))])
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          roots = {'crates', 'docs', 'scripts', 'tasks', '.github'}
          extensions = {'.md', '.rs', '.sh', '.py', '.yaml', '.yml', '.toml'}
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if path == Path('.github/workflows/review-prepare-portability.yaml'):
                  continue
              if path.parts[0] not in roots and path.name not in {'README.md', 'CONTRIBUTING.md'}:
                  continue
              if path.suffix not in extensions:
                  continue
              text = path.read_text(encoding='utf-8')
              changed = text
              for before, after in pairs:
                  changed = changed.replace(before, after)
              if changed != text:
                  path.write_text(changed, encoding='utf-8')
                  print(f'Updated reference: {path}')
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          heading = '\n## Repository path portability\n'
          if heading in text:
              raise SystemExit('Portability instructions already exist; review before appending')
          text += heading + '\nRun `python3 scripts/check-repository-paths.py` before adding or renaming tracked files. The gate checks the complete Git index for Windows-invalid components and case/Unicode path collisions; it does not modify files or omit vendored paths. Run its failure controls with `python3 -m unittest discover -s scripts/tests -p test_repository_paths.py -v`. The Repository portability workflow also performs a real Windows checkout.\n'
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Verify the checker and the complete index
        run: |
          python3 -m unittest discover -s scripts/tests -p test_repository_paths.py -v
          python3 scripts/check-repository-paths.py
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit preparation only to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git add --update
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: make all six contract filenames portable and update references'
          git push origin HEAD:refs/heads/review/02-repository-portability
      - name: Retain tracked source for this review session
        if: always()
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/porffor-review-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: porffor-review-source
          path: ${{ runner.temp }}/porffor-review-source.tar.gz
          if-no-files-found: error
          retention-days: 1
