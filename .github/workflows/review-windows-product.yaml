name: Verify integrated Windows product

# Temporary verification on a non-PR operational branch. Product source is
# pinned independently below; this workflow cannot write repository contents.
on:
  push:
    branches: [review/stack-preparation-20260907]
    paths: [.github/workflows/review-windows-product.yaml]

permissions:
  contents: read

jobs:
  windows-product:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      REVIEW_SHA: be39c0aa0865c2d434a93bf30d86097004573038
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be39c0aa0865c2d434a93bf30d86097004573038
          persist-credentials: false
      - name: Require the exact reviewed source tree
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:REVIEW_SHA) {
            throw 'Unexpected source commit'
          }
          if ((git rev-parse 'HEAD^{tree}') -ne 'c134fe2aec670b6a8de93dd82f5ce0d76d887bfe') {
            throw 'Unexpected integrated source tree'
          }
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP\review-source-sha.txt"
      - name: Build the locked release product on Windows
        shell: pwsh
        run: |
          cargo build --release --locked -p lila-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require the complete compiled product test inventory
        shell: pwsh
        run: |
          cargo test --release --locked -p lila-cli --test product_artifact_execution -- --list | Tee-Object -FilePath "$env:RUNNER_TEMP\product-inventory.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
            'execution_gate_rejects_wrong_results_extra_output_and_oracle_fallback: test',
            'representative_artifacts_execute_with_the_expected_transcripts: test'
          )
          $actual = @(Get-Content "$env:RUNNER_TEMP\product-inventory.txt" | Where-Object { $_ -match ': test$' })
          if ($actual.Count -ne 2 -or @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) {
            throw 'Missing, duplicate, or unexpected product test inventory'
          }
      - name: Execute the ordinary JavaScript fixtures and failure controls
        shell: pwsh
        run: |
          cargo test --release --locked -p lila-cli --test product_artifact_execution -- --test-threads=1 | Tee-Object -FilePath "$env:RUNNER_TEMP\product-results.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary = @(Get-Content "$env:RUNNER_TEMP\product-results.txt" | Where-Object { $_ -match '^test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' })
          if ($summary.Count -ne 1) {
            throw 'Both real execution and failure-control tests must pass without exclusions'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-windows-product-evidence
          path: |
            ${{ runner.temp }}/review-source-sha.txt
            ${{ runner.temp }}/product-inventory.txt
            ${{ runner.temp }}/product-results.txt
            target/release/lila.exe
          retention-days: 7
          if-no-files-found: warn
