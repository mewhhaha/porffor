name: Validate flatMap shared-operation fixes
on:
  push:
    branches: [codex/flatmap-conformance-prepare]
permissions:
  contents: write
concurrency:
  group: flatmap-prepare
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ab5dca2102d330a6ad00900689b896573554158
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: flatmap-conformance
          cache-on-failure: true
      - name: Select the correct shared operation owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('crates/lila-aot-wasm/src/builtins/array.rs')
          s = p.read_text()
          start = s.index('    pub(crate) fn compile_array_prototype_flat_map_builtin(')
          end = s.index('    fn emit_flat_map_append(', start)
          body = s[start:end]
          old = r'        self\.emit_object_read\(\s*this_payload_local,\s*this_tag_local,\s*this_payload_local,\s*this_tag_local,\s*key_local,\s*element_payload_local,\s*element_tag_local,\s*function,\s*\)\?;'
          new = '        self.emit_typed_array_or_object_index_read_from_locals(this_payload_local, this_tag_local, source_index_local, element_payload_local, element_tag_local, function)?;'
          body, count = re.subn(old, new, body)
          assert count == 1, count
          assert body.count('self.emit_function_handle_call_with_argv(') == 1
          body = body.replace('self.emit_function_handle_call_with_argv(', 'self.emit_function_or_proxy_call_with_argv_leave_throw_completion(')
          old_this = '            Some((this_arg_payload_local, Some(this_arg_tag_local))),'
          assert body.count(old_this) == 1
          body = body.replace(old_this, '            this_arg_payload_local,\n            this_arg_tag_local,')
          s = s[:start] + body + s[end:]
          start = s.index('    pub(crate) fn emit_array_species_create(')
          end = s.index('        self.release_temp_local(argv_local);', start)
          species = s[start:end]
          assert species.count('self.emit_function_handle_construct_with_argv(') == 1
          species = species.replace('self.emit_function_handle_construct_with_argv(', 'self.emit_function_or_proxy_construct_with_argv(')
          p.write_text(s[:start] + species + s[end:])
          for name in ['array_flat_map_algorithm_owner_structure.rs', 'array_flat_map_typed_array_witness_structure.rs']:
              p = Path('crates/lila-aot-wasm/tests') / name
              text = p.read_text().replace('emit_function_handle_call_with_argv(', 'emit_function_or_proxy_call_with_argv_leave_throw_completion(')
              if 'algorithm_owner' in name:
                  text = text.replace('"self.emit_object_read("', '"self.emit_typed_array_or_object_index_read_from_locals("')
              else:
                  text = text.replace('("emit_object_read(", 3),', '("emit_object_read(", 2),\n        ("emit_typed_array_or_object_index_read_from_locals(", 1),')
                  text = text.replace('body.find("emit_object_read(")', 'body.find("emit_typed_array_or_object_index_read_from_locals(")')
              p.write_text(text)
          p = Path('docs/rust-rewrite/aot-flat-map.md')
          p.write_text(p.read_text() + '\n\n## Shared-operation review follow-up\n\nExecution exposed three distinct owner choices: callback invocation must use the\nProxy-aware Call dispatcher, ArraySpeciesCreate must use the Proxy-aware Construct\ndispatcher, and source element reads must use the shared indexed-read dispatcher\nthat owns live TypedArray element access. Ordinary named-property Get remains the\nowner for observable length. The ArraySpeciesCreate correction also applies to its\nexisting slice and splice callers; it does not migrate other copied species paths.\n')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff > /tmp/flatmap-shared-fixes.patch
      - name: Build a diagnostic product CLI
        id: build
        run: |
          cargo build --locked -p lila-cli
          mkdir -p /tmp/flatmap-cli-runtime/lib
          cp target/debug/lila /tmp/flatmap-cli-runtime/lila
          ldd target/debug/lila | awk '/=> \// { print $3 } /\/ld-linux/ { print $1 }' | while read lib; do cp "$lib" /tmp/flatmap-cli-runtime/lib/; done
          tar -czf /tmp/flatmap-cli-runtime.tar.gz -C /tmp flatmap-cli-runtime
          tar -czf /tmp/flatmap-shared-source.tar.gz crates/lila-aot-wasm/src/builtins/array.rs crates/lila-aot-wasm/tests/array_flat_map_algorithm_owner_structure.rs crates/lila-aot-wasm/tests/array_flat_map_typed_array_witness_structure.rs docs/rust-rewrite/aot-flat-map.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatmap-shared-diagnostics
          path: |
            /tmp/flatmap-shared-*
            /tmp/flatmap-cli-runtime.tar.gz
          retention-days: 7
      - name: Validate structural contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: structure
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-aot-wasm --test array_flat_map_algorithm_owner_structure --test array_flat_map_typed_array_witness_structure --test array_species_create_operation_evidence_structure --test array_concat_algorithm_owner_structure --test concat_typed_array_witness_structure 2>&1 | tee /tmp/flatmap-structure.log
      - name: Execute all 17 unchanged product regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-engine --test aot_flat_map -- --test-threads=2 2>&1 | tee /tmp/flatmap-engine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatmap-shared-engine
          path: /tmp/flatmap-*.log
          retention-days: 7
      - name: Execute retained CLI fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-cli --test cli -- array_flat_map --test-threads=2 2>&1 | tee /tmp/flatmap-cli.log
      - name: Execute the full pinned flatMap subtree
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: test262
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/lila test262 run built-ins/Array/prototype/flatMap/ --execution-backend wasm --threads 2 --jobs 2 --timeout-ms 60000 --snapshot-dir /tmp/flatmap-test262 --snapshot-name flatmap-shared-fixes 2>&1 | tee /tmp/flatmap-test262.log
          grep -Eq '^total: [1-9][0-9]*$' /tmp/flatmap-test262.log
      - name: Publish only a fully validated follow-up commit
        if: ${{ steps.structure.outcome == 'success' && steps.engine.outcome == 'success' && steps.cli.outcome == 'success' && steps.test262.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/lila-aot-wasm/src/builtins/array.rs crates/lila-aot-wasm/tests/array_flat_map_algorithm_owner_structure.rs crates/lila-aot-wasm/tests/array_flat_map_typed_array_witness_structure.rs docs/rust-rewrite/aot-flat-map.md
          git commit -m 'fix(array): use Proxy-aware calls and shared indexed reads'
          git push origin HEAD:refs/heads/codex/flatmap-shared-operation-fixes
          git rev-parse HEAD | tee /tmp/flatmap-validated-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatmap-shared-conformance
          path: |
            /tmp/flatmap-*.log
            /tmp/flatmap-test262
            /tmp/flatmap-validated-commit.txt
          retention-days: 7
