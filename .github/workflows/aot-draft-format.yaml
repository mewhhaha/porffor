name: Format native-exception draft

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/aot-draft-format.yaml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/aot-native-exception-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Correct fixture transcription and disambiguate catch names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tests = Path('crates/lila-aot-wasm/tests/unit/code_sink_exceptions.rs')
          text = tests.read_text()
          assert 'Vec<Catch>' in text
          text = text.replace('BlockType, CodeSection,', 'BlockType, Catch as CatchClause, CodeSection,', 1)
          text = text.replace('Vec<Catch>', 'Vec<CatchClause>').replace('Catch::', 'CatchClause::')
          tests.write_text(text)
          fixtures = Path('crates/lila-aot-wasm/tests/fixtures/exception_control.rs')
          text = fixtures.read_text()
          start = text.index('pub const NORMAL_COMPLETION:')
          end = text.index('pub const TRAP_NOT_CAUGHT:', start)
          normal = text[start:end]
          bad = '0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x00, 0x01'
          good = '0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x01'
          assert normal.count(bad) == 1
          fixtures.write_text(text[:start] + normal.replace(bad, good, 1) + text[end:])
          PY
      - name: Format and publish only this draft's Rust files
        run: |
          cargo fmt --all
          git add crates/lila-aot-wasm/src/code_sink.rs \
            crates/lila-aot-wasm/tests/unit/code_sink_exceptions.rs \
            crates/lila-aot-wasm/tests/fixtures/exception_control.rs \
            crates/lila-engine/tests/aot_control_flow.rs
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Format exception-control implementation and correct fixture transcription'
          git push origin HEAD:refs/heads/codex/aot-native-exception-control
