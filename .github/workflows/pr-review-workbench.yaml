name: PR review workbench
on:
  push:
    branches: [codex/pr-review-workbench-20260906]
permissions:
  contents: write
concurrency:
  group: pr-review-workbench
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      LILA_MODULE_MEMORY_CACHE_ENTRIES: 2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize and validate the exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr20-final-evidence
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          transfer = base64.b64encode(Path('scripts/pr20-final-fix-transfer.gz').read_bytes()).decode()
          assert transfer.count('ct1Rr3nW6aXka') == 1
          compressed = base64.b64decode(transfer.replace('ct1Rr3nW6aXka', 'ct1Rr3nW6vXka'), validate=True)
          assert hashlib.sha1(b'blob ' + str(len(compressed)).encode() + b'\0' + compressed).hexdigest() == '43c479125f50db67da0332459b1d23def3accda9'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '2d4a0f2a114441a295a87a9586e96cf804f114274bd838b3eab9fa963ea5bc6e'
          Path('/tmp/pr20-final-fix.patch').write_bytes(patch)
          PY
          current=1a1d441adacaf887726892dedf95de4a49e2bf8a
          main=5eb66f1d1f31c972259bbd0a09ec80e28d51a9f5
          git fetch --depth=32 origin "$current" "$main"
          git checkout --detach "$current"
          git apply --check --whitespace=error-all /tmp/pr20-final-fix.patch
          git apply --whitespace=error-all /tmp/pr20-final-fix.patch
          git add -A
          test "$(git write-tree)" = d8d635d8afe7fcc9aa4adc69e738771824a911bb
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/lila-aot-wasm/tests/array_property_semantics_structure.rs')
          s = p.read_text()
          old = 'key_string_local,key_constant_local,function,);'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'key_string_local,key_constant_local,function);'))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          ./scripts/check-module-boundaries.sh
          ./scripts/check-task-plan.sh
          python3 scripts/tests/test_engine_regression_inventory.py
          git add -A
          git diff --cached --check
          git diff --cached --binary "$current" > /tmp/pr20-final-evidence/final.patch
          git write-tree > /tmp/pr20-final-evidence/tree-sha.txt
          for target in typed_array_to_locale_string_witness_structure to_locale_string_invocation_structure array_to_locale_string_observable_structure array_callback_iteration_structure array_flat_map_algorithm_owner_structure array_flat_map_typed_array_witness_structure array_map_algorithm_owner_structure array_filter_algorithm_owner_structure array_every_algorithm_owner_structure array_some_algorithm_owner_structure for_of_string_iterator_protocol_structure direct_sync_for_of_protocol_error_realm_structure plain_async_for_of_await_using_structure synchronous_using_for_of_structure sync_iterator_locals_release_ownership_structure sync_iterator_consumer_capability_structure math_sum_precise_runtime_structure indexed_read_realm_structure object_read_proxy_realm_structure object_read_realm_projection_capability_structure proxy_execution_realm_structure array_property_semantics_structure arguments_index_descriptor_structure array_index_descriptor_structure ordinary_set_receiver_fallback_structure object_get_own_property_descriptor_owner_structure object_write_proxy_realm_structure proxy_revocation_route_ownership_structure array_concat_algorithm_owner_structure; do
            CARGO_MANIFEST_DIR="$PWD/crates/lila-aot-wasm" rustc --edition=2024 --test "crates/lila-aot-wasm/tests/$target.rs" -o "/tmp/$target"
            "/tmp/$target" | tee "/tmp/pr20-final-evidence/$target.txt"
          done
          tree=$(git write-tree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          reviewed=$(printf 'fix(aot): repair computed descriptors, callable setters and indexed read realms\n' | git commit-tree "$tree" -p "$current" -p "$main")
          printf '%s\n' "$reviewed" > /tmp/pr20-final-evidence/source-sha.txt
          git checkout --detach "$reviewed"
          ./scripts/check-readme-status-artifacts.sh "$current"
          for path in .github/workflows/pr-review-workbench.yaml scripts/pr20-final-fix-transfer.gz scripts/pr-review-fix.patch.gz scripts/pr-review-realm.patch.gz; do
            if git cat-file -e "$reviewed:$path" 2>/dev/null; then exit 1; fi
          done
          if git ls-tree -r --name-only "$reviewed" | grep -E '(__pycache__|\.pyc$)'; then exit 1; fi
          for path in crates/lila-cli/tests/fixtures/wasm_array_hasown_length.js crates/lila-cli/tests/fixtures/wasm_array_index_accessor_setter.js crates/lila-engine/tests/aot_arguments_iteration.rs crates/lila-engine/tests/aot_array_to_locale_string_length.rs; do
            test "$(git rev-parse "$current:$path")" = "$(git rev-parse "$reviewed:$path")"
          done
      - name: Publish code-only transport for authorized connector publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=1a1d441adacaf887726892dedf95de4a49e2bf8a
          main=5eb66f1d1f31c972259bbd0a09ec80e28d51a9f5
          reviewed=$(cat /tmp/pr20-final-evidence/source-sha.txt)
          workflow=.github/workflows/array-to-locale-string-conformance.yaml
          git update-index --cacheinfo "100644,$(git rev-parse "$current:$workflow"),$workflow"
          transport_tree=$(git write-tree)
          transport=$(printf 'fix(aot): repair property dispatch and indexed read error realms\n' | git commit-tree "$transport_tree" -p "$current" -p "$main")
          git read-tree "$reviewed"
          printf '%s\n' "$transport" > /tmp/pr20-final-evidence/transport-sha.txt
          printf '%s\n' "$transport_tree" > /tmp/pr20-final-evidence/transport-tree.txt
          test "$(git diff --name-only "$transport" "$reviewed")" = "$workflow"
          gh auth setup-git
          git push origin "$transport:refs/heads/codex/pr20-final-ci-repair-20260906"
      - uses: actions/upload-artifact@v4
        with:
          name: pr20-final-source-evidence
          path: /tmp/pr20-final-evidence
          retention-days: 2
      - name: Execute both originally failing retained CLI fixtures
        shell: bash
        run: |
          set -euo pipefail
          for test in array::run_wasm_backend_succeeds_for_array_hasown_length_fixture array::run_wasm_backend_succeeds_for_array_index_accessor_setter_fixture; do
            output="/tmp/pr20-final-evidence/${test##*::}.txt"
            cargo test --locked -p lila-cli --test cli -- "$test" --exact --test-threads=1 2>&1 | tee "$output"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$output"
          done
      - name: Execute the complete collateral property inventory
        run: python3 scripts/run_engine_regression_inventory.py aot_array_property_regressions --output-dir /tmp/pr20-final-evidence/property-engine --timeout 120
      - name: Execute both new indexed-read Realm regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in indexed_proxy_revocation_keeps_the_locale_method_realm indexed_callable_proxy_getters_keep_the_locale_method_realm; do
            output="/tmp/pr20-final-evidence/$test.txt"
            cargo test --locked -p lila-engine --test aot_array_to_locale_string_observable -- "$test" --exact --test-threads=1 2>&1 | tee "$output"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$output"
          done
      - name: Retain this source's compiler for independent checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -x target/debug/lila; then
            sha256sum target/debug/lila > /tmp/pr20-final-evidence/cli-sha256.txt
            tar -czf /tmp/pr20-final-evidence/cli.tar.gz -C target/debug lila
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr20-final-repair-evidence
          path: /tmp/pr20-final-evidence
          retention-days: 2
