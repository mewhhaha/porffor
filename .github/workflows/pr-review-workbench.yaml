name: PR review workbench
on:
  push:
    branches: [codex/pr-review-workbench-20260906]
permissions:
  contents: write
concurrency:
  group: pr-review-workbench
  cancel-in-progress: true
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the cross-realm repair and preserve concurrent iterator changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-review-evidence
          gzip -dc scripts/pr-review-realm.patch.gz > /tmp/indexed-realm-fix.patch
          echo '86f3f0bdfc74fb43e05f7b2037952dbc6b356247ab31edde4c42b69a919fc57c  /tmp/indexed-realm-fix.patch' | sha256sum -c -
          base=abdcf56f1bd88d5debbb1d8c291f2e7213f77371
          original20=f4030ebaf8273ab25c4e7de6dc9d94061cfc022f
          candidate20=e684ad95a7b8ffdc9e433b1d65672fb69ceed52d
          previous21=05cbd9927e05362904a9dd2845757ae50cfb3191
          current21=acdd0d1aba6e53b9ed65ed42d16bfe953b454221
          for sha in "$base" "$original20" "$candidate20" "$previous21" "$current21"; do git fetch --depth=12 origin "$sha"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$candidate20"
          git diff --binary "$previous21" "$current21" | git apply --whitespace=error-all
          git apply --check --whitespace=error-all /tmp/indexed-realm-fix.patch
          git apply --whitespace=error-all /tmp/indexed-realm-fix.patch
          git add -A
          before_format=$(git write-tree)
          test "$before_format" = c7ebaddb380b8fec9b3559356ce7e235bf174359
          cargo fmt --all
          git diff "$before_format" > /tmp/pr-review-evidence/format.patch
          cargo fmt --all -- --check
          git diff --check
          ./scripts/check-module-boundaries.sh
          ./scripts/check-task-plan.sh
          python3 scripts/tests/test_engine_regression_inventory.py
          for target in typed_array_to_locale_string_witness_structure to_locale_string_invocation_structure array_to_locale_string_observable_structure array_callback_iteration_structure array_flat_map_algorithm_owner_structure array_flat_map_typed_array_witness_structure array_map_algorithm_owner_structure array_filter_algorithm_owner_structure array_every_algorithm_owner_structure array_some_algorithm_owner_structure for_of_string_iterator_protocol_structure direct_sync_for_of_protocol_error_realm_structure plain_async_for_of_await_using_structure synchronous_using_for_of_structure sync_iterator_locals_release_ownership_structure sync_iterator_consumer_capability_structure math_sum_precise_runtime_structure indexed_read_realm_structure object_read_proxy_realm_structure object_read_realm_projection_capability_structure proxy_execution_realm_structure; do
            CARGO_MANIFEST_DIR="$PWD/crates/lila-aot-wasm" rustc --edition=2024 --test "crates/lila-aot-wasm/tests/$target.rs" -o "/tmp/$target"
            "/tmp/$target" | tee "/tmp/pr-review-evidence/$target.txt"
          done
          git add -A
          tree=$(git write-tree)
          reviewed=$(printf 'fix(aot): reconcile locale invocation and preserve indexed read error realms\n' | git commit-tree "$tree" -p "$original20" -p "$current21")
          printf 'PR20 %s %s\n' "$reviewed" "$tree" | tee /tmp/pr-review-evidence/manifest.txt
          git checkout --detach "$reviewed"
          ./scripts/check-readme-status-artifacts.sh "$base"
          git diff --binary "$original20" "$reviewed" > /tmp/pr-review-evidence/pr20.patch
          for path in .github/workflows/pr-review-workbench.yaml scripts/pr-review-fix.patch.gz scripts/pr-review-realm.patch.gz; do
            if git cat-file -e "$reviewed:$path" 2>/dev/null; then exit 1; fi
          done
          if git ls-tree -r --name-only "$reviewed" | grep -E '(__pycache__|\.pyc$)'; then exit 1; fi
          for path in crates/lila-aot-wasm/src/control_flow/arguments_iterator.rs crates/lila-engine/tests/aot_arguments_iteration.rs docs/rust-rewrite/aot-arguments-iteration.md; do
            test "$(git rev-parse "$current21:$path")" = "$(git rev-parse "$reviewed:$path")"
          done
      - name: Publish an isolated candidate for connector inspection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          read -r label reviewed tree < /tmp/pr-review-evidence/manifest.txt
          git push origin "$reviewed:refs/heads/codex/pr20-reviewed-realm-20260906"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-realm-evidence
          path: /tmp/pr-review-evidence
          retention-days: 2
