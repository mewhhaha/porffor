name: Prepare exact shard evidence review

on:
  push:
    branches: [review/07-exact-shard-evidence]
    paths: [.github/workflows/review-prepare-shard-evidence.yaml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate controls and document the exact evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_test262_shard_report.py -v
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          heading = '\n## Real shard evidence validation\n'
          assert heading not in text
          text += heading + '\nThe Array callback workflow binds its shared CLI artifact to the checked-out commit and verifies the executable SHA-256 before execution. Every real subtree shard must report the exact execution count derived from the native modulo partition, the Wasm-AOT backend, all executions passing, and zero in every failure bucket. `python3 scripts/check-test262-shard-report.py --inventory <list-output> --report <shard-output> --shard <index/count>` checks that contract without rewriting evidence. Run its failure controls with `python3 -m unittest discover -s scripts/tests -p test_test262_shard_report.py -v`. The Rust runner still owns the complete execution-ID manifest checks; this textual report gate supplements them and does not establish full-suite conformance or raw-source shortcut closure.\n'
          path.write_text(text, encoding='utf-8')
          PY
          git add README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: explain exact real-shard evidence and binary identity checks'
          git push origin HEAD:refs/heads/review/07-exact-shard-evidence
