name: Register product execution test target

on:
  push:
    branches: [review/04-product-execution]
    paths: [.github/workflows/review-register-product-target.yaml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/04-product-execution
      - name: Register the new target without widening the ledger or changing expected outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('crates/lila-cli/tests/cli/known_failures.rs')
          raw = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if actual != '61fac5a525097d2dbea512b84f6a09b0e0c21b18':
              raise SystemExit(f'Test-target owner changed unexpectedly: {actual}')
          text = raw.decode('utf-8')
          changes = [
              ('    Perf,\n', '    Perf,\n    /// `tests/product_artifact_execution.rs`.\n    ProductArtifactExecution,\n'),
              ('            TestTarget::Perf => "perf",\n', '            TestTarget::Perf => "perf",\n            TestTarget::ProductArtifactExecution => "product_artifact_execution",\n'),
              ('            "perf" => Some(TestTarget::Perf),\n', '            "perf" => Some(TestTarget::Perf),\n            "product_artifact_execution" => Some(TestTarget::ProductArtifactExecution),\n'),
              ('            "perf" => Ok(TestTarget::Perf),\n', '            "perf" => Ok(TestTarget::Perf),\n            "product_artifact_execution" => Ok(TestTarget::ProductArtifactExecution),\n'),
          ]
          for before, after in changes:
              if text.count(before) != 1:
                  raise SystemExit(f'Expected exactly one target registration anchor: {before!r}')
              text = text.replace(before, after)
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit only on the product review branch
        shell: bash
        run: |
          set -euo pipefail
          git add crates/lila-cli/tests/cli/known_failures.rs
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: include product execution target in the closed audit domain'
          git push origin HEAD:refs/heads/review/04-product-execution
