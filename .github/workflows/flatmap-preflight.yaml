name: flatMap baseline and product preflight
on:
  push:
    branches: [codex/flatmap-conformance-preflight]
permissions:
  contents: read
concurrency:
  group: flatmap-preflight
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify unchanged baseline compiler and complete test inventory
        run: |
          test "$(git hash-object crates/lila-aot-wasm/src/builtins/array.rs)" = a9afe45ca05cb9fb70e78511dd610da954a8668e
          test "$(grep -c '^#\[test\]' crates/lila-engine/tests/aot_flat_map.rs)" = 16
          test -s .github/preflight/flatmap-replacement.rs
      - name: Execute all 16 regressions on unchanged main
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-engine --test aot_flat_map -- --test-threads=1 2>&1 | tee /tmp/flatmap-baseline.log
      - name: Replace only the flatMap algorithm and format
        id: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/lila-aot-wasm/src/builtins/array.rs')
          source = p.read_text()
          start = source.index('    pub(crate) fn compile_array_prototype_flat_map_builtin(')
          end = source.index('    pub(crate) fn emit_array_iteration_length_before_callback_validation(', start)
          replacement = Path('.github/preflight/flatmap-replacement.rs').read_text()
          p.write_text(source[:start] + replacement + '\n' + source[end:])
          PY
          cargo fmt --all
      - name: Execute the same 16 regressions on the product change
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lila-engine --test aot_flat_map -- --test-threads=1 2>&1 | tee /tmp/flatmap-product.log
      - name: Build the product CLI
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: cargo build --locked -p lila-cli
      - name: Execute the complete pinned flatMap Test262 subtree
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/lila test262 run built-ins/Array/prototype/flatMap/ --execution-backend wasm --threads 2 --jobs 2 --timeout-ms 60000 --snapshot-dir /tmp/flatmap-test262 --snapshot-name flatmap-preflight 2>&1 | tee /tmp/flatmap-test262.log
          grep -Eq '^total: [1-9][0-9]*$' /tmp/flatmap-test262.log
      - name: Preserve reports and the exact formatted implementation
        if: always()
        run: tar -czf /tmp/flatmap-formatted.tar.gz crates/lila-aot-wasm/src/builtins/array.rs crates/lila-engine/tests/aot_flat_map.rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatmap-preflight-evidence
          path: |
            /tmp/flatmap-*.log
            /tmp/flatmap-test262
            /tmp/flatmap-formatted.tar.gz
          retention-days: 7
